/* ============== 页面：人员分析 ============== */
function renderStaff() {
  // 2026-07-21：日/周/月对比（COMPARE_DATA 由 switchPeriod 算好）
  const cs = COMPARE_DATA;
  const cmpLabel = COMPARE_LABEL;
  // 短格式对比标签："2026-07-19"→"07-19"；"W2"；"06月"
  const cmpShort = (label) => {
    if (!label) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(label)) return label.substring(5);
    const wm = label.match(/W\d+/);
    if (wm) return wm[0];
    const mm = label.match(/^(\d{4})-(\d{2})/);
    if (mm) return mm[2] + "月";
    return label;
  };
  const cmpShortLabel = cmpShort(cmpLabel);
  // 上一期员工 map（name → staff dict）
  const cmpStaffMap = {};
  if (cs && cs.staff) cs.staff.forEach(s => { cmpStaffMap[s.name] = s; });
  // 当前/上期 总单 B C D
  const curTotal = CURRENT_DATA.staff.reduce((s, x) => s + x.total, 0);
  const curB = CURRENT_DATA.staff.reduce((s, x) => s + x.B, 0);
  const curC = CURRENT_DATA.staff.reduce((s, x) => s + x.C, 0);
  const curD = CURRENT_DATA.staff.reduce((s, x) => s + x.D, 0);
  const cmpTotal = cs ? cs.staff.reduce((s, x) => s + x.total, 0) : 0;
  const cmpB = cs ? cs.staff.reduce((s, x) => s + x.B, 0) : 0;
  const cmpC = cs ? cs.staff.reduce((s, x) => s + x.C, 0) : 0;
  const cmpD = cs ? cs.staff.reduce((s, x) => s + x.D, 0) : 0;
  // 颜色 class helpers（与总览页一致）
  const trendCls = (cur, base) => {
    if (!cs) return "";
    if (cur == null || base == null) return "";
    if (cur > base) return "up";
    if (cur < base) return "down";
    return "flat";
  };
  const kpiCls = (cur, base, type) => {
    const t = trendCls(cur, base);
    return t ? `${t}-${type}` : "";
  };
  // 排名/明细表单元格用：变化箭头 + diff + %
  const cmpCell = (cur, base, mode) => {
    if (!cs) return '<span style="color:#7a8ba0">—</span>';
    if (cur == null) cur = 0;
    if (base == null) base = 0;
    if (cur === 0 && base === 0) return '<span style="color:#7a8ba0">—</span>';
    if (base === 0) return `<span style="color:#00ff88;font-size:11px">新 ${cur}</span>`;
    const diff = cur - base;
    const pct = (diff / Math.abs(base)) * 100;
    const arrow = diff > 0 ? "▲" : (diff < 0 ? "▼" : "·");
    let color = "#7a8ba0";
    if (diff !== 0) {
      if (mode === "rate") color = diff > 0 ? "#00ff88" : "#ff4757";
      else if (mode === "amount") color = diff < 0 ? "#00ff88" : "#ff4757";
    }
    return `<span style="color:${color};font-size:11px">${arrow} ${diff > 0 ? "+" : ""}${diff} (${pct > 0 ? "+" : ""}${pct.toFixed(1)}%)</span>`;
  };
  // KPI sub 文字（员工页特殊：4 个维度统一 amount 模式，涨红降绿不变黄）
  // 业务逻辑：员工页所有"涨"都"需要关注"（红），"降"都"工作减轻"（绿）
  // 格式：▲ 上期值 (+X.X%)  ——  跟总览页 fmt.cmp 输出一致，只是去掉"vs XX:" 前缀
  const kpiSub = (cur, base) => {
    if (!cs) return "";
    if (cur == null || base == null) return "无对比基准";
    const diff = cur - base;
    if (diff === 0) return `<span style="color:#ffa502">持平</span>`;
    const pct = (diff / Math.abs(base)) * 100;
    const arrow = diff > 0 ? "▲" : "▼";
    const color = diff > 0 ? "#ff4757" : "#00ff88";  // amount：涨红降绿
    const baseStr = fmt.num(Math.round(base));
    const signPct = pct > 0 ? "+" : "";
    return `<span style="color:${color}">${arrow} ${baseStr} (${signPct}${pct.toFixed(1)}%)</span>`;
  };

  // 2026-07-21 调整：3 个全量排名表（总单 / 全自动失败 / 订单转人工）
  // 占比 = 该员工该指标 / 当期该指标总和
  const rankings = [
    { icon: '🏆', title: '总单排行', key: 'total', label: '总单', totalSum: curTotal, color: '#00ff88', mode: 'rate' },

/* ============== 页面：流程归因 ============== */
function renderStage() {
  const s = CURRENT_DATA.stage_distribution || [];
  const subs = CURRENT_DATA.stage_subcategory || [];
  const ds = CURRENT_DATA.daily_stage || [];
  const monthLabel = CURRENT_MONTH === "all" ? "全月" : CURRENT_MONTH;
  const totalFail = CURRENT_DATA.total_fail_orders || 0;
  const cs = COMPARE_DATA;  // 对比基准（可能是 day 或 month 维度）

  // 对比数据：找每个 stage 的总单数 / pct
  const cmpStageMap = {};
  if (cs && cs.stage_distribution) {
    cs.stage_distribution.forEach(st => { cmpStageMap[st.stage] = st; });
  }
  const cmpTotalFail = (cs && cs.total_fail_orders) || 0;
  // 对比数据：找每个 subcategory 的 count
  const cmpSubMap = {};
  if (cs && cs.stage_subcategory) {
    cs.stage_subcategory.forEach(sub => { cmpSubMap[sub.category] = sub; });
  }

  // 1. 顶部 KPI 条（每阶段一个）+ 对比徽章
  const kpiHtml = s.map(st => {
    const cmp = cmpStageMap[st.stage];
    // amount 模式：值越低越好（失败阶段少单=好转）
    const cmpBadgeHtml = cmp
      ? fmt.cmp(st.total, cmp.total, "amount", false)
      : `<span class="cmp-no">无对比基准</span>`;
    return `<div class="kpi" style="border-color:${st.color}">
      <div class="kpi-label" style="color:${st.color}">${stageIcon(st.stage)} ${st.stage}</div>
      <div class="kpi-value" style="color:${st.color}">${st.total.toLocaleString()}</div>
      <div class="kpi-foot">${st.pct}% · B:${st.B} D:${st.D}</div>
      <div class="kpi-sub-row">${cmpBadgeHtml}</div>
    </div>`;
  }).join("");

  // 2. 子类表：加 "vs 对比" 列
  const subRows = subs.map(sub => {
    const cmp = cmpSubMap[sub.category];
    const cmpBadgeHtml = cmp
      ? fmt.cmp(sub.count, cmp.count, "amount", false)
      : `<span class="cmp-no">—</span>`;
    return `<tr>
      <td><span style="color:${sub.color}">●</span> ${sub.category}</td>
      <td style="text-align:right">${sub.count.toLocaleString()}</td>
      <td style="text-align:right;color:${sub.color}">${sub.pct}%</td>
      <td style="text-align:right;font-size:11px">${cmpBadgeHtml}</td>
    </tr>`;
  }).join("");

  // 3. 堆叠数据（X=日期，series=6 个阶段）
  const stages = ["预定", "支付", "取票", "回填", "验真", "未走完"];
  const stageColorMap = {};
  s.forEach(st => stageColorMap[st.stage] = st.color);
  const stackSeries = stages.map(st => ({
    name: st,
    type: "bar",
    stack: "total",
    emphasis: { focus: "series" },
    itemStyle: { color: stageColorMap[st] || "#7a8ba0" },
    data: ds.map(d => d[st] || 0)
  }));

  const html = `
    <div class="section">
      <div class="section-title">🔧 流程归因 · ${monthLabel}
        <span class="badge badge-info">B+D 总失败 ${totalFail.toLocaleString()} 单</span>
        ${cs ? `<span class="badge badge-info" style="background:#1e3a5f">对比 ${COMPARE_LABEL}</span>` : ""}
      </div>
      <div class="kpi-row cols-6">${kpiHtml}</div>
    </div>

    <div class="section">
      <div class="section-title">📊 阶段占比 · 5 大流程 + 兜底</div>
      <div id="chartStagePie" style="height:380px"></div>
    </div>

    <div class="section">
      <div class="section-title">📅 每日失败原因 · 阶段堆叠柱状图</div>
      <div class="chart-hint">点击图例可隐藏/显示某个阶段。柱越高 = 当天失败单越多。</div>
      <div id="chartDailyStack" style="height:420px"></div>
    </div>

    <div class="section">
      <div class="section-title">🗂 失败原因子类明细（按阶段排序）</div>
      <table class="detail-table">
        <thead><tr><th>类别</th><th style="text-align:right">单数</th><th style="text-align:right">占失败%</th>
          ${cs ? '<th style="text-align:right">vs ' + COMPARE_LABEL + '</th>' : ''}
        </tr></thead>
        <tbody>${subRows}</tbody>
      </table>
    </div>
  `;
  document.getElementById("mainArea").innerHTML = html;

  // 渲染两个图
  setTimeout(() => {
    // 饼图：tooltip 加对比信息
    const pieData = s.map(st => ({ name: st.stage, value: st.total, itemStyle: { color: st.color } }));
    const pie = echarts.init(document.getElementById("chartStagePie"));
    pie.setOption({
      tooltip: {
        trigger: "item",
        formatter: (p) => {
          const cmp = cmpStageMap[p.name];
          const cur = p.value;
          const curPct = p.percent;
          if (!cmp) {
            return `${p.name}<br/>当前: ${cur.toLocaleString()} (${curPct.toFixed(1)}%)`;
          }
          const diff = cur - cmp.total;
          const cmpPct = cmpTotalFail ? (cmp.total / cmpTotalFail * 100).toFixed(1) : 0;
          return `${p.name}<br/>` +
                 `当前: ${cur.toLocaleString()} (${curPct.toFixed(1)}%)<br/>` +
                 `${COMPARE_LABEL}: ${cmp.total.toLocaleString()} (${cmpPct}%)<br/>` +
                 `差值: ${diff >= 0 ? '+' : ''}${diff.toLocaleString()}`;
        }
      },
      legend: { bottom: 0, textStyle: { color: "#aab5c5" } },
      series: [{
        type: "pie",
        radius: ["40%", "70%"],
        center: ["50%", "45%"],
        avoidLabelOverlap: true,
        label: { color: "#aab5c5", formatter: "{b}\n{d}%" },
        data: pieData
      }]
    });
    chartInstances["stagePie"] = pie;

    // 堆叠柱状
    const stack = echarts.init(document.getElementById("chartDailyStack"));
    stack.setOption({
      tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
      legend: { top: 0, textStyle: { color: "#aab5c5" } },
      grid: { top: 50, left: 50, right: 30, bottom: 60 },
      xAxis: {
        type: "category",
        data: ds.map(d => d.date.substring(5)),
        axisLabel: { color: "#aab5c5", rotate: 45 }
      },
      yAxis: { type: "value", axisLabel: { color: "#aab5c5" } },
      dataZoom: [{ type: "inside" }, { type: "slider", height: 20, bottom: 10 }],
      series: stackSeries
    });
    chartInstances["dailyStack"] = stack;
  }, 50);
}

// v10：环节颜色映射（一眼可辨哪一环出问题了）
// 注：全局函数，被 renderFail 和 stageSummaryHtml 都要用
function getStageColor(famName) {
if (!famName) return "#7a8ba0";
if (famName.startsWith("人工环节")) return "#ff6b9d";        // 粉红
if (famName.startsWith("系统环节")) return "#ffd93d";        // 金黄
if (famName.startsWith("预定环节")) return "#ff4757";        // 红色（高频）
if (famName.startsWith("支付环节")) return "#ff6348";        // 橙红
if (famName.startsWith("取票环节")) return "#ffa502";        // 橙色
if (famName.startsWith("验真环节")) return "#9c88ff";        // 紫色
if (famName.startsWith("回填环节")) return "#70a1ff";        // 蓝色
if (famName.startsWith("平台环节")) return "#5f27cd";        // 深紫
if (famName.startsWith("其他环节")) return "#7a8ba0";        // 灰色
return "#00e5ff";
}

// v10：环节分组（按 8 大环节分组聚合）
// 注：全局函数，被 renderFail 和 stageSummaryHtml 都要用
function groupByStage(families) {
const STAGE_ORDER = [
"人工环节", "系统环节", "预定环节", "支付环节",
"取票环节", "验真环节", "回填环节", "平台环节", "其他环节"
];
const stageMap = {};
STAGE_ORDER.forEach(s => stageMap[s] = 0);
families.forEach(f => {
const stage = (f.family || "").split("-")[0];
if (stageMap[stage] === undefined) stageMap["其他环节"] += f.count;
else stageMap[stage] += f.count;
});
return STAGE_ORDER
.map(s => ({ stage: s, count: stageMap[s] }))
.filter(x => x.count > 0)
.sort((a, b) => b.count - a.count);
}

      ? (cmp ? fmt.cmp(f.count, cmp.count, "amount", false) : `<span style="color:#7a8ba0">新增</span>`)

    const stageColor = getStageColor(f.family);
    return `<tr>
      <td>${i + 1}</td>
      <td><span style="display:inline-block;width:10px;height:10px;background:${stageColor};border-radius:2px;margin-right:6px"></span><strong>${escapeHtml(f.family)}</strong></td>

      <td>${fmt.pct(f.count / CURRENT_DATA.summary.D * 100)}</td>

    </tr>`;
  };

  // === v10：环节汇总条（B/D 各 1 行，紧贴在族级表上方）===
  // 2026-07-30: anim-stagger-parent 包裹, 每张卡 anim-stagger 触发错位渐入
  const bStages = groupByStage(CURRENT_DATA.fail_families_B || []);
  const dStages = groupByStage(CURRENT_DATA.fail_families_D || []);
  const stageSummaryHtml = (stages, path, total) => {
    if (!stages.length) return "";
    const maxCount = Math.max(...stages.map(s => s.count));
    const cells = stages.map(s => {
      const color = getStageColor(s.stage + "-x");  // 取色用 stage 名

      return `<div class="anim-stagger" style="flex:1;min-width:90px;background:#0a1929;border-left:3px solid ${color};padding:8px 10px;margin-right:6px;border-radius:3px;--w:${barW}%;position:relative;overflow:hidden">
        <div style="font-size:11px;color:#7a8ba0">${escapeHtml(s.stage)}</div>
        <div style="font-size:18px;font-weight:bold;color:${color}">${fmt.num(s.count)}</div>
        <div style="font-size:10px;color:#7a8ba0">${fmt.pct(s.count / total * 100)}</div>
        <span class="anim-bar" style="display:block;position:absolute;bottom:0;left:0;height:2px;width:100%;background:rgba(0,0,0,0.2)"><i style="display:block;height:100%;width:0;background:${color};transition:width 1.2s cubic-bezier(0.25,1,0.5,1) 0.3s"></i></span>
      </div>`;
    }).join("");
    return `<div class="anim-stagger-parent" style="display:flex;flex-wrap:wrap;margin-bottom:12px">${cells}</div>`;
  };

  // === 原始行（清洗后，第二级展开时用）===
  // 2026-07-30: tr 加 anim-reveal, 渐入 + 占比条
  const bReasonRow = (r, i, famName) => {
    const cmp = cmpBMap[r.full];
    const cmpBadge = cs
      ? (cmp ? fmt.cmp(r.count, cmp.count, "amount", false) : `<span style="color:#7a8ba0">新增</span>`)

    const pctW = CURRENT_DATA.summary.B ? (r.count / CURRENT_DATA.summary.B * 100).toFixed(0) : 0;
    return `<tr class="anim-reveal" onclick="toggleDrill('B', ${i}, this)" style="cursor:pointer;--w:${pctW}%;position:relative" data-idx="${i}">
      <td>${i + 1}</td>
      <td title="${escapeHtml(r.full)}"><span style="color:#00e5ff">▸ </span>${escapeHtml(r.reason)}</td>
      <td>${fmt.num(r.count)}</td>
      <td>${fmt.pct(r.count / CURRENT_DATA.summary.B * 100)}</td>
      <td style="font-size:11px">${cmpBadge}</td>
    </tr>`;
  };
  const dReasonRow = (r, i) => {
    const cmp = cmpDMap[r.full];
    const cmpBadge = cs
      ? (cmp ? fmt.cmp(r.count, cmp.count, "amount", false) : `<span style="color:#7a8ba0">新增</span>`)
      : "—";
    const pctW = CURRENT_DATA.summary.D ? (r.count / CURRENT_DATA.summary.D * 100).toFixed(0) : 0;
    return `<tr class="anim-reveal" onclick="toggleDrill('D', ${i}, this)" style="cursor:pointer;--w:${pctW}%;position:relative" data-idx="${i}">
      <td>${i + 1}</td>
      <td title="${escapeHtml(r.full)}"><span style="color:#00e5ff">▸ </span>${escapeHtml(r.reason)}</td>
      <td>${fmt.num(r.count)}</td>
      <td>${fmt.pct(r.count / CURRENT_DATA.summary.D * 100)}</td>
      <td style="font-size:11px">${cmpBadge}</td>
    </tr>`;
  };

  const html = `
    <div class="section">
      <div class="section-title">⚠️ B 路径 全自动失败环节（9 大环节 · ${fmt.num(CURRENT_DATA.summary.B)} 单）
        ${cmpBHdr}
      </div>
      <div class="chart-box" style="margin-top:14px">
        <div class="chart-title">🎯 B 路径 环节汇总（哪一环出问题？）</div>
        ${stageSummaryHtml(bStages, "B", CURRENT_DATA.summary.B)}
      </div>
      <div class="chart-box" style="margin-top:14px">
        <div class="chart-title">📋 B 路径 全自动失败环节（9 大环节 · 全量展示）</div>
        <table class="data-table">
          <thead>
            <tr><th>排名</th><th>族名</th><th>单数</th><th>占比（B 路径）</th>
              ${cs ? '<th>vs ' + COMPARE_LABEL + '</th>' : ''}
            </tr>
          </thead>
          <tbody id="bFamilyTbody">${bFamilies.map(bFamilyRow).join("")}</tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🚨 D 路径 全自动失败环节（9 大环节 · ${fmt.num(CURRENT_DATA.summary.D)} 单）
        ${cmpDHdr}
      </div>
      <div class="chart-box" style="margin-top:14px">
        <div class="chart-title">🎯 D 路径 环节汇总（哪一环出问题？）</div>
        ${stageSummaryHtml(dStages, "D", CURRENT_DATA.summary.D)}
      </div>
      <div class="chart-box" style="margin-top:14px">
        <div class="chart-title">📋 D 路径 全自动失败环节（9 大环节 · 全量展示）</div>
        <table class="data-table">
          <thead>
            <tr><th>排名</th><th>族名</th><th>单数</th><th>占比（D 路径）</th>
              ${cs ? '<th>vs ' + COMPARE_LABEL + '</th>' : ''}
            </tr>
          </thead>
          <tbody id="dFamilyTbody">${dFamilies.map(dFamilyRow).join("")}</tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById("mainArea").innerHTML = html;

  // B 路径失败原因 - 横向柱（2026-07-26 简化：按 9 大环节，配色用 stage 语义色）
  const bReasons = bFamilies;  // 9 行族数据（族名 + count）
  const dReasons = dFamilies;
  createChart("chart-failB", {
    ...baseEchartsOpt,
    tooltip: {
      ...baseEchartsOpt.tooltip,
      trigger: "axis",
      formatter: (params) => {
        const p = params[0];
        const r = bReasons[bReasons.length - 1 - p.dataIndex];
        const cmp = cmpBFamMap[r.family];
        const cur = r.count;
        let html = `<b>${r.family}</b><br/>当前: ${fmt.num(cur)} 单`;
        if (cmp) {
          const diff = cur - cmp.count;
          html += `<br/>${COMPARE_LABEL}: ${fmt.num(cmp.count)} 单<br/>差值: ${diff >= 0 ? '+' : ''}${fmt.num(diff)}`;
        } else if (cs) {
          html += `<br/><span style="color:#ffa502">▲ 新增环节</span>`;
        }
        return html;
      }
    },
    grid: { left: 100, right: 50, top: 20, bottom: 30 },
    xAxis: { type: "value", axisLabel: { color: "#7a8ba0" },
              splitLine: { lineStyle: { color: "#1e3a5f40" } } },
    yAxis: { type: "category",
              data: bReasons.map(r => r.family).reverse(),
              axisLabel: { color: "#7a8ba0", fontSize: 12, fontWeight: "bold" } },
    series: [{
      type: "bar",
      data: bReasons.map(r => ({ value: r.count, itemStyle: { color: getStageColor(r.family) } })).reverse(),
      label: { show: true, position: "right", color: "#e0e6f0",
        formatter: p => fmt.num(p.value) },
    }],
  });

  createChart("chart-failD", {
    ...baseEchartsOpt,
    tooltip: {
      ...baseEchartsOpt.tooltip,
      trigger: "axis",
      formatter: (params) => {
        const p = params[0];
        const r = dReasons[dReasons.length - 1 - p.dataIndex];
        const cmp = cmpDFamMap[r.family];
        const cur = r.count;
        let html = `<b>${r.family}</b><br/>当前: ${fmt.num(cur)} 单`;
        if (cmp) {
          const diff = cur - cmp.count;
          html += `<br/>${COMPARE_LABEL}: ${fmt.num(cmp.count)} 单<br/>差值: ${diff >= 0 ? '+' : ''}${fmt.num(diff)}`;
        } else if (cs) {
          html += `<br/><span style="color:#ffa502">▲ 新增环节</span>`;
        }
        return html;
      }
    },
    grid: { left: 100, right: 50, top: 20, bottom: 30 },
    xAxis: { type: "value", axisLabel: { color: "#7a8ba0" },
              splitLine: { lineStyle: { color: "#1e3a5f40" } } },
    yAxis: { type: "category",
              data: dReasons.map(r => r.family).reverse(),
              axisLabel: { color: "#7a8ba0", fontSize: 12, fontWeight: "bold" } },
    series: [{
      type: "bar",
      data: dReasons.map(r => ({ value: r.count, itemStyle: { color: getStageColor(r.family) } })).reverse(),
      label: { show: true, position: "right", color: "#e0e6f0",
        formatter: p => fmt.num(p.value) },
    }],
  });
}

/* ============== 失败分析（v12 纯失败根因，删掉流程归因） ==============
 * - 8 大环节族级表（B/D 垂直堆叠）—— 失败归因
 * - 流程归因已删（漏斗图 + KPI 条 + 子分类明细都不要了，避免和族级重复）
 *
 * 设计动机（2026-06-20 改进）：
 * 用户反馈流程归因 + 失败根因并存重复，且 B 路径族展开卡顿。
 *   1. 删流程归因：流程归因用"失败原因"当前卡点 vs 失败根因用"第一次失败原因"根因，
 *      两套数据不同但容易被用户混淆。保留更精准的失败根因。
 *   2. 修 B 路径卡顿：之前每次点族行要遍历 1526 项 reason × 37 条正则 = 5.6 万次匹配。
 *      现在后端预计算 family 字段，前端直接 O(1) 比较。
 */
function renderFailureAnalysis() {
  // 1. 失败根因数据（B/D）
  // v10.14.7（2026-07-03）：根据"选月/选日"切换数据源
  //   - 选月（day="all"）：用顶层 fail_reasons_B（prev_count=上月）
  //   - 选日（day!=all）：用 daily_detail[date].fail_reasons_B（prev_count=前一天）
  const isDayView = CURRENT_DAY && CURRENT_DAY !== "all";
  let curMonthData = CURRENT_DATA.months && CURRENT_DATA.months[CURRENT_MONTH];
  let curFailReasonsB, curFailReasonsD, curFailFamiliesB, curFailFamiliesD;
  let curSummaryB, curSummaryD, curTotalB, curTotalD;
  let curSummaryA, curTotalA;  // 2026-07-29: 自动分析 V2 算 A 成功率需要 curSummaryA
  if (isDayView && curMonthData && curMonthData.daily_detail) {
    const dateKey = `${CURRENT_MONTH}-${CURRENT_DAY.padStart(2, "0")}`;
    const dayData = curMonthData.daily_detail[dateKey];
    if (dayData) {
      curFailReasonsB = dayData.fail_reasons_B || [];
      curFailReasonsD = dayData.fail_reasons_D || [];
      curFailFamiliesB = dayData.fail_families_B || [];
      curFailFamiliesD = dayData.fail_families_D || [];
      curSummaryB = dayData.summary.B;
      curSummaryD = dayData.summary.D;
      curTotalB = dayData.summary.total_orders;
      curTotalD = dayData.summary.total_orders;
      curSummaryA = dayData.summary.A;
      curTotalA = dayData.summary.total_orders;
    }
  }
  // 兜底：如果日表没数据 / 选月视图，用顶层
  if (!curFailReasonsB) {
    curFailReasonsB = CURRENT_DATA.fail_reasons_B || [];
    curFailReasonsD = CURRENT_DATA.fail_reasons_D || [];
    curFailFamiliesB = CURRENT_DATA.fail_families_B || [];
    curFailFamiliesD = CURRENT_DATA.fail_families_D || [];
    curSummaryB = CURRENT_DATA.summary.B;
    curSummaryD = CURRENT_DATA.summary.D;
    curTotalB = CURRENT_DATA.summary.total_orders;
    curTotalD = CURRENT_DATA.summary.total_orders;
    curSummaryA = CURRENT_DATA.summary.A;
    curTotalA = CURRENT_DATA.summary.total_orders;
  }

  const cs = COMPARE_DATA;

  const bFamilies = (curFailFamiliesB || []).slice(0, 30);
  const dFamilies = (curFailFamiliesD || []).slice(0, 30);

  const cmpBMap = {};
  const cmpDMap = {};
  if (cs) {
    (cs.fail_reasons_B || []).forEach(r => { cmpBMap[r.full] = r; });
    (cs.fail_reasons_D || []).forEach(r => { cmpDMap[r.full] = r; });
  }
  const cmpBFamMap = {};
  const cmpDFamMap = {};
  if (cs) {
    (cs.fail_families_B || []).forEach(f => { cmpBFamMap[f.family] = f; });
    (cs.fail_families_D || []).forEach(f => { cmpDFamMap[f.family] = f; });
  }

  // 2. 失败根因族级行（2026-07-26 简化：9 大环节 + 点族行展开原始根因 + 5 维度下钻）
  // 2026-07-30: 加 anim-reveal 触发错位渐入
  const bFamilyRow = (f, i) => {
    const cmp = cmpBFamMap[f.family];
    const cmpBadge = cs
      ? (cmp ? fmt.cmp(f.count, cmp.count, "amount", false) : `<span style="color:#7a8ba0">新增</span>`)
      : "—";
    const stageColor = getStageColor(f.family);
    const pctW = curSummaryB ? (f.count / curSummaryB * 100).toFixed(0) : 0;
    return `<tr class="anim-reveal" onclick="toggleFamilyDrill('B', ${i}, this)" style="cursor:pointer;--w:${pctW}%;position:relative" data-fam-idx="${i}">
      <td>${i + 1}</td>
      <td><span style="display:inline-block;width:10px;height:10px;background:${stageColor};border-radius:2px;margin-right:6px"></span><strong>${escapeHtml(f.family)}</strong> <span style="color:#00e5ff;font-size:10px">▸ 点击展开</span></td>
      <td>${fmt.num(f.count)}</td>
      <td>${fmt.pct(f.count / curSummaryB * 100)}</td>
      <td style="font-size:11px">${cmpBadge}</td>
    </tr>`;
  };
  const dFamilyRow = (f, i) => {
    const cmp = cmpDFamMap[f.family];
    const cmpBadge = cs
      ? (cmp ? fmt.cmp(f.count, cmp.count, "amount", false) : `<span style="color:#7a8ba0">新增</span>`)
      : "—";
    const stageColor = getStageColor(f.family);
    const pctW = curSummaryD ? (f.count / curSummaryD * 100).toFixed(0) : 0;
    return `<tr class="anim-reveal" onclick="toggleFamilyDrill('D', ${i}, this)" style="cursor:pointer;--w:${pctW}%;position:relative" data-fam-idx="${i}">
      <td>${i + 1}</td>
      <td><span style="display:inline-block;width:10px;height:10px;background:${stageColor};border-radius:2px;margin-right:6px"></span><strong>${escapeHtml(f.family)}</strong> <span style="color:#00e5ff;font-size:10px">▸ 点击展开</span></td>
      <td>${fmt.num(f.count)}</td>
      <td>${fmt.pct(f.count / curSummaryD * 100)}</td>
      <td style="font-size:11px">${cmpBadge}</td>
    </tr>`;
  };

  // 3. 失败根因族级环节汇总条
  // 2026-07-30: anim-stagger-parent + 每卡 anim-stagger 触发错位渐入
  const bStages = groupByStage(curFailFamiliesB || []);
  const dStages = groupByStage(curFailFamiliesD || []);
  const stageSummaryHtml = (stages, total) => {
    if (!stages.length) return "";
    const maxCount = Math.max(...stages.map(s => s.count));
    const cells = stages.map(s => {
      const color = getStageColor(s.stage + "-x");
      const barW = maxCount ? (s.count / maxCount * 100).toFixed(0) : 0;
      return `<div class="anim-stagger" style="flex:1;min-width:90px;background:#0a1929;border-left:3px solid ${color};padding:8px 10px;margin-right:6px;border-radius:3px;--w:${barW}%;position:relative;overflow:hidden">
        <div style="font-size:11px;color:#7a8ba0">${escapeHtml(s.stage)}</div>
        <div style="font-size:18px;font-weight:bold;color:${color}">${fmt.num(s.count)}</div>
        <div style="font-size:10px;color:#7a8ba0">${fmt.pct(s.count / total * 100)}</div>
        <span class="anim-bar" style="display:block;position:absolute;bottom:0;left:0;height:2px;width:100%;background:rgba(0,0,0,0.2)"><i style="display:block;height:100%;width:0;background:${color};transition:width 1.2s cubic-bezier(0.25,1,0.5,1) 0.3s"></i></span>
      </div>`;
    }).join("");
    return `<div class="anim-stagger-parent" style="display:flex;flex-wrap:wrap;margin-bottom:12px">${cells}</div>`;
  };

  // 3.5 失败子分类明细（2026-07-26 新增）
  //   - 8 大环节汇总 + 9 大环节族级表都只显示"环节"维度，看不到"亏损过大/利润过大/未匹配规则"等子分类
  //   - 这里是子分类层级：按 r.family 聚合（"预定环节-亏损过大-反采同程"等）→ 按 8 大环节分组展示
  //   - 数据源：fail_reasons_B/D（每个 reason 自带完整 family 字段）
  const subFamByStage = (reasons) => {
    const map = {};
    reasons.forEach(r => {
      const full = r.family || "其他环节";
      const stage = full.split("-")[0];
      if (!map[stage]) map[stage] = {};
      map[stage][full] = (map[stage][full] || 0) + r.count;
    });
    return Object.entries(map).map(([stage, fams]) => {
      const arr = Object.entries(fams)
        .map(([family, count]) => ({family, count}))
        .sort((a, b) => b.count - a.count);
      return {stage, total: arr.reduce((s, x) => s + x.count, 0), families: arr};
    }).sort((a, b) => b.total - a.total);
  };
  const subFamB = subFamByStage(curFailReasonsB || []);
  const subFamD = subFamByStage(curFailReasonsD || []);
  const subFamHtml = (subFamData, total) => {
    if (!subFamData.length) return "";
    return subFamData.map(({stage, total: stageTotal, families}) => {
      const color = getStageColor(stage);
      return `<div style="background:#0a1929;border-left:3px solid ${color};padding:8px 10px;margin-bottom:6px;border-radius:3px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <strong style="color:${color}">${escapeHtml(stage)}</strong>
          <span style="color:#7a8ba0;font-size:11px">${fmt.num(stageTotal)} 单 / 占总 ${fmt.pct(stageTotal / total * 100)}</span>
        </div>
        <table style="width:100%;font-size:12px;border-collapse:collapse">
          ${families.map(f => `
            <tr style="border-bottom:1px solid #1e3a5f">
              <td style="padding:3px 0;color:#cfd8e3">${escapeHtml(f.family)}</td>
              <td style="padding:3px 0;text-align:right;color:#00e5ff;width:80px">${fmt.num(f.count)}</td>
              <td style="padding:3px 0;text-align:right;color:#7a8ba0;width:60px;font-size:11px">${fmt.pct(f.count / total * 100)}</td>
            </tr>
          `).join('')}
        </table>
      </div>`;
    }).join('');
  };

  const cmpBHdr = cs
    ? `<span class="badge badge-info" style="background:#1e3a5f">对比 ${COMPARE_LABEL}：B ${fmt.num(cs.summary.B)} 单</span>`
    : "";
  const cmpDHdr = cs
    ? `<span class="badge badge-info" style="background:#1e3a5f">对比 ${COMPARE_LABEL}：D ${fmt.num(cs.summary.D)} 单</span>`
    : "";

  // 3.7 V1 自动分析（vs 基准期）：新出现 / 大幅增加 / 大幅减少
  //   依据: curFailReasonsB/D 的 prev_count 字段
  //   - 日视图: prev_count = 前一天失败原因 count
  //   - 月视图: prev_count = 上月失败原因 count (当前 gen 输出 0)
  //   - 无基准时 (cs == null) 整段隐藏
  // V1 名称叫 v1AutoAnalysisHtml, 跟 V3 autoAnalysisHtml 区分 (V3 是勾选式)
  // V3 之后加 V1: 业务方既要看 "修了能到多少" (V3) 又要看 "vs 上期变化" (V1)
  const v1AutoAnalysisHtml = (reasons, path, total) => {
    if (!cs || !reasons || !reasons.length) return "";
    // 三类: 新出现 (prev=0, count>0), 大幅增加 (prev>0, diff>0), 大幅减少 (prev>count)
    const newOnes = reasons.filter(r => (!r.prev_count || r.prev_count === 0) && r.count > 0)
      .sort((a, b) => b.count - a.count).slice(0, 5);
    const upBig = reasons.filter(r => r.prev_count > 0 && r.count > r.prev_count)
      .map(r => ({...r, _diff: r.count - r.prev_count, _pct: (r.count - r.prev_count) / r.prev_count * 100}))
      .sort((a, b) => b._pct - a._pct).slice(0, 10);
    const downBig = reasons.filter(r => r.prev_count > 0 && r.count < r.prev_count)
      .map(r => ({...r, _diff: r.count - r.prev_count, _pct: (r.count - r.prev_count) / r.prev_count * 100}))
      .sort((a, b) => a._pct - b._pct).slice(0, 5);
    if (!newOnes.length && !upBig.length && !downBig.length) return "";
    const newRow = r => `
      <div class="v1-row v1-row-2col">
        <span class="v1-reason" title="${escapeHtml(r.full)}">${escapeHtml(r.reason)}</span>
        <span class="v1-num v1-num-warn">${fmt.num(r.count)}</span>
      </div>`;
    const diffRow = r => {
      const isUp = r._diff > 0;
      const arrow = isUp ? "↑" : "↓";
      const sign = isUp ? "+" : "";
      const cls = isUp ? "v1-num-bad" : "v1-num-good";
      return `
      <div class="v1-row v1-row-5col">
        <span class="v1-reason" title="${escapeHtml(r.full)}">${escapeHtml(r.reason)}</span>
        <span class="v1-num v1-num-current">${fmt.num(r.count)}</span>
        <span class="v1-num v1-num-prev">${fmt.num(r.prev_count)}</span>
        <span class="v1-num ${cls}">${arrow} ${sign}${fmt.num(r._diff)}</span>
        <span class="v1-num ${cls}">${sign}${r._pct.toFixed(0)}%</span>
      </div>`;
    };
    return `
    <div class="section">
      <div class="section-title">📊 基期对比分析（vs ${escapeHtml(cmpLabelShort)}）
        <span class="badge badge-info">${path} 路径 · ${fmt.num(total)} 单</span>
      </div>
      ${newOnes.length ? `
      <div class="v1-block">
        <div class="v1-block-title" style="color:#a855f7">🆕 新出现的失败原因（${newOnes.length}）</div>
        <div class="v1-list">${newOnes.map(newRow).join("")}</div>
      </div>` : ""}
      ${upBig.length ? `
      <div class="v1-block">
        <div class="v1-block-title" style="color:#ff4757">📈 大幅增加（${upBig.length} · 按涨幅）</div>
        <div class="v1-list">${upBig.map(diffRow).join("")}</div>
      </div>` : ""}
      ${downBig.length ? `
      <div class="v1-block">
        <div class="v1-block-title" style="color:#00ff88">📉 大幅减少（${downBig.length} · 优化见效）</div>
        <div class="v1-list">${downBig.map(diffRow).join("")}</div>
      </div>` : ""}
    </div>`;
  };

  // 3.7 自动分析 V2（vs 基准期）：勾选式业务影响分析
  //   - 数据源: curFailReasonsB 已有 prev_count 字段
  //   - 日/月视图自动适配（日视图: prev = 前一天, 月视图: prev = 上月）
  //   - 没有基准时 (cs == null) 整段隐藏
  //   - 输出: 总结行 + 4 按钮 (Top 5/10/20/清空) + Top 20 勾选表
  //   - 勾选变化实时算累计 diff / 预期 A 成功率
  //   - 不持久化（刷新页面重置）
  const cmpLabelShort = cs ? (COMPARE_LABEL || "上一期") : "";
  const autoAnalysisHtml = (reasons, path, total) => {
    if (!cs || !reasons || !reasons.length) return "";
    // 当前 path summary.A / summary.B 是 path 维度的, 用于算 A 成功率
    const sumA = path === "B" ? curSummaryA : (curMonthData && curMonthData.summary ? curMonthData.summary.A : 0);
    const sumB = path === "B" ? curSummaryB : (curMonthData && curMonthData.summary ? curMonthData.summary.B : 0);
    const totalAB = sumA + sumB;
    // 2026-07-29 V3: 不看 diff, 直接看 B 路径的 reason 修好多少能让 A 成功率到多少
    // 排除 count=0 的 (无效 reason), 按 count 降序取 Top 20
    const candidates = reasons.filter(r => r.count > 0)
      .sort((a, b) => b.count - a.count)  // 按单量降序 (修这条影响最大)
      .slice(0, 20);
    if (!candidates.length) return "";
    // 理论上限 (修 100% B 路径) + 乐观现实 (修 50% B 路径)
    const curRate = sumA / totalAB * 100;
    const theoreticalRate = (sumA + sumB) / totalAB * 100;  // 100%
    const optimisticRate = (sumA + sumB * 0.5) / totalAB * 100;  // 50%
    // 渲染行: 单条 (sorted 之后 diff, single_lift, single_new_rate 已算好)
    const rowHtml = (r, idx) => {
      return `
      <label class="aa-row">
        <input type="checkbox" class="aa-pick" data-idx="${idx}" data-diff="${r.count}">
        <span class="aa-row-reason" title="${escapeHtml(r.full)}">${escapeHtml(r.reason)}</span>
        <span class="aa-row-total">${fmt.num(r.count)} 单</span>
      </label>`;
    };
    return `
    <div class="section">
      <div class="section-title">💡 全自动成功率预测（点击体验）
        <span class="badge badge-info">${path} 路径 · ${fmt.num(sumB)} 单</span>
      </div>
      <div class="chart-hint" style="margin-bottom:10px">
        勾选/取消 → 实时算累计 A 成功率（5 个数字实时变化 + scale bump 动效）
      </div>
      <div class="aa-kpi-row" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px">
        <div class="kpi" style="padding:14px 16px">
          <div class="kpi-label" style="color:#7a8ba0;font-size:11px">当前 A 成功率</div>
          <div class="kpi-value" id="aa-curRate-${path}" style="font-size:26px;color:#00e5ff;text-shadow:0 0 16px rgba(0,229,255,0.3)">${curRate.toFixed(2)}%</div>
        </div>
        <div class="kpi" style="padding:14px 16px">
          <div class="kpi-label" style="color:#7a8ba0;font-size:11px">已选</div>
          <div class="kpi-value" id="aa-count-${path}" style="font-size:26px;color:#00e5ff;text-shadow:0 0 16px rgba(0,229,255,0.3)">0 条</div>
        </div>
        <div class="kpi" style="padding:14px 16px">
          <div class="kpi-label" style="color:#7a8ba0;font-size:11px">累计单数</div>
          <div class="kpi-value" id="aa-cumdiff-${path}" style="font-size:26px;color:#00e5ff;text-shadow:0 0 16px rgba(0,229,255,0.3)">+0</div>
        </div>
        <div class="kpi" style="padding:14px 16px">
          <div class="kpi-label" style="color:#7a8ba0;font-size:11px">预期 A 成功率</div>
          <div class="kpi-value" id="aa-rate-${path}" style="font-size:26px;color:#00ff88;text-shadow:0 0 16px rgba(0,255,136,0.3)">${curRate.toFixed(2)}%</div>
        </div>
        <div class="kpi" style="padding:14px 16px">
          <div class="kpi-label" style="color:#7a8ba0;font-size:11px">提升</div>
          <div class="kpi-value" id="aa-lift-${path}" style="font-size:26px;color:#00ff88;text-shadow:0 0 16px rgba(0,255,136,0.3)">+0.00%</div>
        </div>
      </div>
      <div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="drill-btn aa-quick" data-path="${path}" data-n="5">☑ 全选 Top 5</button>
        <button class="drill-btn aa-quick" data-path="${path}" data-n="10">☑ 全选 Top 10</button>
        <button class="drill-btn aa-quick" data-path="${path}" data-n="20">☑ 全选 Top 20</button>
        <button class="drill-btn aa-quick" data-path="${path}" data-n="0">☐ 清空</button>
      </div>
      <div class="aa-list" id="aa-tbody-${path}">${candidates.map(rowHtml).join("")}</div>
    </div>`;
  };

  // 4. HTML 主体：9 大环节 + V1 基期对比 + V3 勾选式（垂直堆叠）
  const html = `
    <div class="section">
      <div class="section-title">⚠️ 全自动失败环节（9 大环节 · ${fmt.num(curSummaryB)} 单）
        ${cmpBHdr}
      </div>
      <div class="chart-box" style="margin-top:14px">
        <div class="chart-title">🎯 B 路径 8 大环节汇总（哪一环出问题）</div>
        ${stageSummaryHtml(bStages, curSummaryB)}
      </div>
      <div class="chart-box" style="margin-top:14px">
        <div class="chart-title">📋 B 路径 全自动失败环节（9 大环节 · 全量展示）</div>
        <table class="data-table">
          <thead>
            <tr><th>排名</th><th>族名</th><th>单数</th><th>占比（B 路径）</th>
              ${cs ? '<th>vs ' + COMPARE_LABEL + '</th>' : ''}
            </tr>
          </thead>
          <tbody id="bFamilyTbody">${bFamilies.map(bFamilyRow).join("")}</tbody>
        </table>
      </div>
    </div>
    ${v1AutoAnalysisHtml(curFailReasonsB, "B", curSummaryB)}
    ${autoAnalysisHtml(curFailReasonsB, "B", curSummaryB)}
  `;
  document.getElementById("mainArea").innerHTML = html;
  // v10.14.7: 把当前视图的数据存全局变量，供 toggleFamilyDrill / toggleExpandFamily 用
  CURRENT_FAIL_FAMILIES_B = curFailFamiliesB;
  CURRENT_FAIL_FAMILIES_D = curFailFamiliesD;
  CURRENT_FAIL_REASONS_B = curFailReasonsB;
  CURRENT_FAIL_REASONS_D = curFailReasonsD;
  CURRENT_FAIL_VIEW = isDayView ? "daily" : "monthly";
  // 2026-07-29: 自动分析勾选交互 (checkbox 变化 → 实时算累计预期 A 成功率)
  bindAutoAnalysisPicks(curSummaryA, curSummaryB);
}

// 失败分析 → 自动分析 → 勾选式交互
function bindAutoAnalysisPicks(aBase, bBase) {
  const total = aBase + bBase;
  const curRate = (aBase / total) * 100;
  const update = () => {
    const checks = document.querySelectorAll(".aa-pick:checked");
    let cumDiff = 0;
    checks.forEach(c => { cumDiff += parseInt(c.dataset.diff, 10) || 0; });
    const newRate = ((aBase + cumDiff) / total) * 100;
    const lift = newRate - curRate;
    const count = checks.length;
    // 更新所有 path 维度的累计数 (B/D 各自一份, 但通常只渲染 B)
    ["B", "D"].forEach(p => {
      const cnt = document.getElementById(`aa-count-${p}`);
      const cd = document.getElementById(`aa-cumdiff-${p}`);
      const rt = document.getElementById(`aa-rate-${p}`);
      const lf = document.getElementById(`aa-lift-${p}`);
      if (cnt) {
        cnt.textContent = `${count} 条`;
        AnimEngine.v3Bump(cnt);  // 2026-07-31: 补 bump（之前只 bump 2/5 数字）
      }
      if (cd) {
        cd.textContent = `+${fmt.num(cumDiff)}`;
        AnimEngine.v3Bump(cd);
      }
      if (rt) {
        rt.textContent = `${newRate.toFixed(2)}%`;
        rt.style.color = lift > 0 ? "#00ff88" : (lift < 0 ? "#ff4757" : "#7a8ba0");
        // 数字变更触发 v3-bump 动效
        AnimEngine.v3Bump(rt);
      }
      if (lf) {
        lf.textContent = `${lift >= 0 ? "+" : ""}${lift.toFixed(2)}%`;
        lf.style.color = lift > 0 ? "#00ff88" : (lift < 0 ? "#ff4757" : "#7a8ba0");
        AnimEngine.v3Bump(lf);
      }
    });
  };
  document.querySelectorAll(".aa-pick").forEach(c => c.addEventListener("change", update));
  // 快捷按钮
  document.querySelectorAll(".aa-quick").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = parseInt(btn.dataset.n, 10);
      const allChecks = document.querySelectorAll(".aa-pick");
      allChecks.forEach((c, i) => {
        if (n === 0) c.checked = false;
        else c.checked = (i < n);
      });
      update();
    });
  });
}


/* ============== 失败根因下钻面板 ============== */
let currentDrillKey = null;  // 当前展开的下钻，格式 "B-3" 或 "D-5"
let currentFamilyKey = null; // 当前展开的族，格式 "fam-B-0"
let currentFamilyExpanded = false; // 当前族展开是否显示全部 reason（默认 Top 20）

// 族展开里的 reason 表格渲染（v12 拆出来单独函数，支持"展开全部"切换）
// v10.14.7（2026-07-03）：prevLabel 动态显示（不再是写死"前一天"）
function renderFamilyReasonRows(reasons, allReasons, path, fam, expanded) {
  const shown = expanded ? reasons : reasons.slice(0, 20);
  // v10.14.7: prevLabel 根据"选月/选日"动态显示
  const isDayView = CURRENT_DAY && CURRENT_DAY !== "all";
  const rows = shown.map((r, i) => {
    const prev = r.prev_count || 0;
    const diff = r.count - prev;
    const diffSign = diff > 0 ? "+" : (diff < 0 ? "" : "±");
    const diffColor = diff > 0 ? "#00d4aa" : (diff < 0 ? "#ff4757" : "#7a8ba0");
    const diffArrow = diff > 0 ? "↑" : (diff < 0 ? "↓" : "→");
    const prevLabel = isDayView ? "前一天" : (r.prev_month || "上月");
    // 2026-07-27: 案例订单号 (从 gen 端 sample_orders 字段取, 前 3 个)
    const ordersHtml = (r.orders && r.orders.length)
      ? r.orders.map(o => `<code style="background:#1e3a5f;color:#00e5ff;padding:1px 5px;border-radius:2px;font-size:11px">${escapeHtml(o)}</code>`).join(" ")
      : '<span style="color:#7a8ba0;font-size:11px">—</span>';
    return `
    <tr class="anim-reveal" style="--w:${(r.count / fam.count * 100).toFixed(0)}%;position:relative">
      <td>${i + 1}</td>
      <td title="${escapeHtml(r.full)}">${escapeHtml(r.reason)}</td>
      <td>${fmt.num(r.count)}</td>
      <td>${fmt.pct(r.count / fam.count * 100)}</td>
      <td style="color:${diffColor}">${diffArrow} ${diffSign}${fmt.num(diff)}</td>
      <td style="color:#7a8ba0">${fmt.num(prev)} <span style="font-size:10px">(${prevLabel})</span></td>
      <td>${ordersHtml}</td>
      <td>
        <button class="drill-btn" onclick="toggleDrill('${path}', ${allReasons.indexOf(r)}, this.closest('tr'))">5 维度下钻 ▾</button>
      </td>
    </tr>
  `}).join("");
  // 底部按钮：展开全部 / 收起回 Top 20
  const expandBtn = reasons.length > 20 ? `
    <tr>
      <td colspan="8" style="text-align:center;padding:10px">
        <button class="drill-btn" onclick="toggleExpandFamily()" style="min-width:200px">
          ${expanded ? `▲ 收起（仅显示前 20 条）` : `▼ 展开全部 ${reasons.length} 条`}
        </button>
      </td>
    </tr>
  ` : "";
  return rows + expandBtn;
}

// 切换"展开全部 / 收起"按钮的回调（重新渲染 tbody）
function toggleExpandFamily() {
  currentFamilyExpanded = !currentFamilyExpanded;
  // 找当前族展开面板的 tbody，替换 innerHTML
  const panel = document.querySelector("#family-drill-row .family-subtable tbody");
  if (!panel) return;
  // 从 DOM 上读出当前族的 path 和 idx（用 currentFamilyKey 解析）
  const key = currentFamilyKey; // 形如 "fam-B-3"
  const m = key && key.match(/^fam-([BD])-(\d+)$/);
  if (!m) return;
  const path = m[1], famIdx = parseInt(m[2]);
  const families = path === "B" ? (CURRENT_FAIL_FAMILIES_B || []) : (CURRENT_FAIL_FAMILIES_D || []);
  const allReasons = path === "B" ? (CURRENT_FAIL_REASONS_B || []) : (CURRENT_FAIL_REASONS_D || []);
  const fam = families[famIdx];
  // 2026-07-26 修复：按环节前缀匹配 (r.family.split("-")[0] === fam.family)
  const reasons = allReasons.filter(r => (r.family || "").split("-")[0] === fam.family);
  panel.innerHTML = renderFamilyReasonRows(reasons, allReasons, path, fam, currentFamilyExpanded);
}

// 族级展开：显示该族下所有原始原因（清洗后但未族聚合）
function toggleFamilyDrill(path, famIdx, rowEl) {
  const key = `fam-${path}-${famIdx}`;
  if (currentFamilyKey === key) {
    collapseFamilyDrill();
    return;
  }
  collapseFamilyDrill();
  collapseDrill();
  const families = path === "B" ? (CURRENT_FAIL_FAMILIES_B || []) : (CURRENT_FAIL_FAMILIES_D || []);
  const allReasons = path === "B" ? (CURRENT_FAIL_REASONS_B || []) : (CURRENT_FAIL_REASONS_D || []);
  const fam = families[famIdx];
  if (!fam) return;
  currentFamilyKey = key;
  currentFamilyExpanded = false; // 默认折叠状态

  // 2026-07-26 修复：fam.family 是 get_stage_only 输出（8 大环节，不带子分类），
  //   r.family 是完整族名（带 "-子分类"），直接 r.family === fam.family 永远 False
  //   要按"环节前缀"匹配：r.family.split("-")[0] === fam.family
  //   例：点"预定环节"族行 → 找 r.family.startsWith("预定环节-") 的所有 reason
  const reasons = allReasons.filter(r => (r.family || "").split("-")[0] === fam.family);

  // 在族行下方插入二级面板
  const colspan = 5;
  const tr = rowEl;
  const newTr = document.createElement("tr");
  newTr.id = "family-drill-row";
  newTr.classList.add("drill-row");
  // 标题 + 关闭按钮 + 原始原因表格 + 5 维度钻取按钮
  newTr.innerHTML = `<td colspan="${colspan}" style="padding:0; background:#0a1424">
    <div class="drill-panel">
      <div class="drill-header">
        <div class="drill-title">
          <span style="color:#00e5ff">▾ ${escapeHtml(fam.family)}</span>
          <span class="badge badge-info" style="margin-left:8px">${fmt.num(fam.count)} 单</span>
          <span class="badge badge-warn" style="margin-left:4px">包含 ${reasons.length} 个原始根因</span>
        </div>
        <button class="drill-close" onclick="collapseFamilyDrill()">收起 ✕</button>
      </div>
      <div class="family-subtable">
        <table class="data-table">
          <thead>
            <tr><th style="width:50px">#</th><th>原始根因（清洗后）</th><th>单数</th><th>占比</th><th>vs 基准</th><th>基准单数</th><th>案例订单号</th><th>钻取</th></tr>
          </thead>
          <tbody>
            ${renderFamilyReasonRows(reasons, allReasons, path, fam, currentFamilyExpanded)}
          </tbody>
        </table>
      </div>
    </div>
  `;
  tr.parentNode.insertBefore(newTr, tr.nextSibling);
}

function collapseFamilyDrill() {
  const el = document.getElementById("family-drill-row");
  if (el) el.remove();
  currentFamilyKey = null;
  currentFamilyExpanded = false;
}

function toggleDrill(path, idx, rowEl) {
  const key = `${path}-${idx}`;
  // 同一个面板再次点击：收起
  if (currentDrillKey === key) {
    collapseDrill();
    return;

  // 收起旧的，展开新的
  collapseDrill();
  const drillData = (path === "B" ? CURRENT_DATA.fail_drill_B : CURRENT_DATA.fail_drill_D) || [];
  const d = drillData[idx];
  if (!d) return;
  currentDrillKey = key;

  // 在表格行下方插入下钻面板
  const tr = rowEl;
  const colspan = 5;
  const newTr = document.createElement("tr");
  newTr.id = "drill-row";
  newTr.classList.add("drill-row");
  newTr.innerHTML = `<td colspan="${colspan}" style="padding:0; background:#0a1424">
    <div class="drill-panel">
      <div class="drill-header">
        <div class="drill-title">
          <span style="color:#00e5ff">▾ ${escapeHtml(d.reason)}</span>
          <span class="badge badge-info" style="margin-left:8px">${fmt.num(d.total)} 单</span>

  setTimeout(() => {
    renderDrillCharts(key, d);
  }, 50);
}

function collapseDrill() {

function renderDrillCharts(key, d) {

      tooltip: { ...baseEchartsOpt.tooltip, trigger: "axis", axisPointer: { type: "shadow" } },
      xAxis: { type: "value", axisLabel: { color: "#b0c4de", fontSize: 10 } },
      yAxis: { type: "category", data: d.airline_dist.map(x => x.name).reverse(), axisLabel: { color: "#b0c4de", fontSize: 10 } },
      series: [{
        type: "bar",
        data: d.airline_dist.map(x => x.count).reverse(),
        itemStyle: { color: "#ff9f43" },
        label: { show: true, position: "right", color: "#ff9f43", fontSize: 10, formatter: "{c}" },
      }],
    });
  }
  // 3. 航司 × 平台 交叉图
  // 根据维度数动态选图表：
  //   双方都 ≥ 2  → 热力图（标准）
  //   一方只有 1  → 横向条形图（避免 1×N 长条）
  if (d.cross && d.cross.airlines && d.cross.airlines.length && d.cross.platforms && d.cross.platforms.length) {
    const nAir = d.cross.airlines.length;
    const nPlat = d.cross.platforms.length;
    // 汇总：每个 (airline, platform) 的单数
    const pairs = [];
    d.cross.airlines.forEach((a, i) => {
      d.cross.platforms.forEach((p, j) => {
        const v = d.cross.data[i][j];
        if (v > 0) pairs.push({ airline: a, platform: p, count: v });
      });
    });
    pairs.sort((x, y) => y.count - x.count);

    if (nAir >= 2 && nPlat >= 2) {
      // 标准热力图
      const heatData = [];
      d.cross.airlines.forEach((a, i) => {
        d.cross.platforms.forEach((p, j) => {
          heatData.push([j, i, d.cross.data[i][j]]);
        });
      });
      createChart(`drill-${key}-cross`, {
        ...baseEchartsOpt,
        tooltip: {
          position: "top",
          formatter: (p) => {
            const airline = d.cross.airlines[p.value[1]];
            const platform = d.cross.platforms[p.value[0]];
            return `${airline} × ${platform}<br/><b>${p.value[2]}</b> 单`;
          },
        },
        grid: { left: 80, right: 30, top: 20, bottom: 60 },
        xAxis: {
          type: "category",
          data: d.cross.platforms,
          axisLabel: { color: "#b0c4de", fontSize: 10, rotate: 30, interval: 0 },
          splitArea: { show: true },
        },
        yAxis: {
          type: "category",
          data: d.cross.airlines,
          axisLabel: { color: "#b0c4de", fontSize: 10 },
          splitArea: { show: true },
        },
        visualMap: {
          min: 0,
          max: Math.max(...heatData.map(h => h[2])),
          calculable: true,
          orient: "horizontal",
          left: "center",
          bottom: 5,
          textStyle: { color: "#b0c4de", fontSize: 10 },
          inRange: { color: ["#0a1a2e", "#1e3a5f", "#00e5ff", "#ff4757"] },
        },
        series: [{
          name: "失败单数",
          type: "heatmap",
          data: heatData,
          label: {
            show: true,
            color: "#fff",
            fontSize: 10,
            formatter: (p) => p.value[2] > 0 ? p.value[2] : "",
          },
          emphasis: { itemStyle: { shadowBlur: 10, shadowColor: "rgba(0,229,255,0.5)" } },
        }],
      });
    } else {
      // 1×N 或 N×1：横向条形图，按 (airline × platform) 组合排序
      const labels = pairs.map(p => `${p.airline} × ${p.platform}`);
      const data = pairs.map(p => p.count);
      createChart(`drill-${key}-cross`, {
        ...baseEchartsOpt,
        tooltip: {
          ...baseEchartsOpt.tooltip,
          trigger: "axis",
          axisPointer: { type: "shadow" },
          formatter: (params) => {
            const p = params[0];
            const pair = pairs[p.dataIndex];
            return `${pair.airline} × ${pair.platform}<br/><b>${p.value}</b> 单`;
          },
        },
        grid: { left: 140, right: 30, top: 30, bottom: 30 },
        xAxis: { type: "value", axisLabel: { color: "#b0c4de", fontSize: 10 } },
        yAxis: {
          type: "category",
          data: labels.slice().reverse(),
          axisLabel: { color: "#b0c4de", fontSize: 10 },
        },
        series: [{
          type: "bar",
          data: data.slice().reverse(),
          itemStyle: {
            color: (params) => {
              const pair = pairs[data.length - 1 - params.dataIndex];
              return pair.count > d.total * 0.5 ? "#ff4757" : pair.count > d.total * 0.2 ? "#ff9f43" : "#00e5ff";
            },
            borderRadius: [0, 4, 4, 0],
          },
          label: {
            show: true,
            position: "right",
            color: "#fff",
            fontSize: 11,
            fontWeight: "bold",
            formatter: "{c}",
          },
          emphasis: { itemStyle: { shadowBlur: 10, shadowColor: "rgba(0,229,255,0.5)" } },
        }],
      });
    }
  }
  // 4. 日期趋势
  if (d.date_trend && d.date_trend.length) {
    createChart(`drill-${key}-date`, {
      ...baseEchartsOpt,
      grid: { left: 50, right: 20, top: 20, bottom: 50 },
      tooltip: { ...baseEchartsOpt.tooltip, trigger: "axis" },
      xAxis: { type: "category", data: d.date_trend.map(x => x.date.slice(5)), axisLabel: { color: "#b0c4de", fontSize: 9, rotate: 30 } },
      yAxis: { type: "value", axisLabel: { color: "#b0c4de", fontSize: 10 } },
      series: [{
        type: "line",
        data: d.date_trend.map(x => x.count),
        smooth: true,
        itemStyle: { color: "#00e5ff" },
        lineStyle: { color: "#00e5ff", width: 2 },
        areaStyle: { color: "rgba(0,229,255,0.15)" },
      }],
    });
  }
  // 5. 员工救场
  if (d.staff_dist && d.staff_dist.length) {
    createChart(`drill-${key}-staff`, {
      ...baseEchartsOpt,
      grid: { left: 70, right: 20, top: 10, bottom: 25 },
      tooltip: { ...baseEchartsOpt.tooltip, trigger: "axis", axisPointer: { type: "shadow" } },
      xAxis: { type: "value", axisLabel: { color: "#b0c4de", fontSize: 10 } },
      yAxis: { type: "category", data: d.staff_dist.map(x => x.name).reverse(), axisLabel: { color: "#b0c4de", fontSize: 10 } },
      series: [{
        type: "bar",
        data: d.staff_dist.map(x => x.count).reverse(),
        itemStyle: { color: "#00ff88" },
        label: { show: true, position: "right", color: "#00ff88", fontSize: 10, formatter: "{c}" },
      }],
    });
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

      if (v < 51) return 2;
      if (v < 151) return 3;
      return 4;
    };
    // matrix 结构: matrix[category_idx][platform_idx]
    // 显示布局: 行=类型(category), 列=平台
    const repeatCats = repeatCross.categories;
    const repeatPlats = repeatCross.platforms;
    let repeatHtml = `<div class="heatmap" style="grid-template-columns: 200px repeat(${repeatPlats.length}, 1fr);">`;
    repeatHtml += `<div class="hm-cell empty"></div>`;
    repeatPlats.forEach(p => {
      repeatHtml += `<div class="hm-cell head">${escapeHtml(p)}</div>`;
    });
    repeatCats.forEach((cat, ci) => {
      repeatHtml += `<div class="hm-cell row-head">${escapeHtml(cat)}</div>`;
      repeatPlats.forEach((plat, pi) => {
        const v = repeatCross.matrix[ci] ? (repeatCross.matrix[ci][pi] || 0) : 0;
        const tier = repeatTier(v);
        if (tier == null) {
          repeatHtml += `<div class="hm-cell empty"></div>`;
        } else {
          repeatHtml += `<div class="hm-cell" data-tier="${tier}" title="${escapeHtml(cat)} × ${escapeHtml(plat)}: ${v} 单">${v}</div>`;
        }
      });
    });
    repeatHtml += `</div>`;
    repeatHtml += `
      <div class="hm-legend">
        <span><span class="sw" style="background:rgba(255,71,87,0.4)"></span>&lt;10 单</span>
        <span><span class="sw" style="background:rgba(255,165,2,0.3)"></span>10-50</span>
        <span><span class="sw" style="background:rgba(0,229,255,0.18)"></span>51-150</span>
        <span><span class="sw" style="background:rgba(0,255,136,0.12)"></span>&gt;150（高）</span>
      </div>
    `;
    document.getElementById("chart-heatmap-repeat").innerHTML = repeatHtml;
  } else {
    document.getElementById("chart-heatmap-repeat").innerHTML = `<div style="padding:40px;text-align:center;color:#7a8ba0">⚠️ 暂无重复订单</div>`;
  }
}


/* ============== 页面：产品时限（2026-07-30 新增）============== */
/* 公式: 产品时限(分钟) = 最新截止日期 - 平台时间 (剩余出票时间) */
function renderDeadline() {
  const d = (CURRENT_DATA && CURRENT_DATA.summary && CURRENT_DATA.summary.deadline) || null;
  if (!d || !d.count) {
    document.getElementById("mainArea").innerHTML = `
      <div class="section">
        <div class="section-title">⏰ 产品时限分析</div>
        <div style="padding:40px;text-align:center;color:#7a8ba0">⚠️ 当前周期暂无产品时限数据</div>
      </div>`;
    return;
  }

  // 比较基准（如果选月有 COMPARE_DATA，则对比）
  const cmp = (COMPARE_DATA && COMPARE_DATA.summary && COMPARE_DATA.summary.deadline) || null;
  const cmpBadge = (cur, base, isPct) => {
    if (!cmp || base == null) return "";
    const diff = cur - base;
    const arrow = diff > 0 ? "▲" : (diff < 0 ? "▼" : "·");
    const color = diff === 0 ? "#7a8ba0" : (diff > 0 ? "#ff4757" : "#00ff88");  // 时限越大 = 越不紧迫 (绿色好); 时限变小 = 紧迫 (红色警示)
    return `<span class="cmp-badge" style="color:${color}">${arrow} ${isPct ? base.toFixed(1) + "%" : base.toFixed(0)}</span>`;
  };

  // 月份 label
  const monthLabel = CURRENT_MONTH === "all" ? "全月"
    : (CURRENT_WEEK !== "all" ? `${CURRENT_MONTH} ${CURRENT_WEEK.split("|")[1] || CURRENT_WEEK}`
    : (CURRENT_DAY !== "all" ? `${CURRENT_MONTH} ${CURRENT_DAY} 日` : CURRENT_MONTH));

  // 时限格式: < 60min 显示 "X min", 否则 "X h"
  const fmtMin = (m) => m == null ? "—" : (m < 60 ? `${Math.round(m)} min` : `${(m / 60).toFixed(1)} h`);
  const fmtMinShort = (m) => m == null ? "—" : (m < 60 ? `${Math.round(m)}` : `${(m / 60).toFixed(1)}h`);

  // 4 KPI 卡
  const kpiHtml = `
    <div class="kpi ${d.median_min < 240 ? '' : ''}">
      <div class="kpi-label">📊 中位产品时限</div>
      <div class="kpi-value" style="color:#ffffff">${fmtMin(d.median_min)}</div>
      <div class="kpi-sub">P50 = ${d.median_min.toFixed(0)} min</div>
      <div class="kpi-sub-row">${cmp ? cmpBadge(d.median_min, cmp.median_min) : ""}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">⚠️ P10 紧急区</div>
      <div class="kpi-value" style="color:#ff4757">${d.p10_min.toFixed(0)}<span class="kpi-unit">min</span></div>
      <div class="kpi-sub">10% 单只剩 ${d.p10_min.toFixed(0)} min 出票</div>
      <div class="kpi-sub-row">${cmp ? cmpBadge(d.p10_min, cmp.p10_min) : ""}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">🕐 &lt;1h 占比</div>
      <div class="kpi-value">${d.under_1h_pct.toFixed(1)}<span class="kpi-unit">%</span></div>
      <div class="kpi-sub">${fmt.num(d.distribution.under_1h)} 单剩 1h 内</div>
      <div class="kpi-sub-row">${cmp ? `<span class="cmp-badge" style="color:#7a8ba0">${cmp.under_1h_pct.toFixed(1)}%</span>` : ""}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">🚨 &lt;15min 紧急</div>
      <div class="kpi-value" style="color:#ffa502">${d.distribution.under_15min}<span class="kpi-unit">单</span></div>
      <div class="kpi-sub">占 ${(d.distribution.under_15min / d.count * 100).toFixed(2)}% · 需立即处理</div>
    </div>
  `;

  // 平台 × 航司 矩阵热力图
  const tierOf = (m) => {
    if (m == null) return null;
    if (m < 120) return 1;     // < 2h 红
    if (m < 1440) return 2;    // 2-24h 橙
    if (m < 2880) return 3;    // 24-48h 青
    return 4;                  // > 48h 绿
  };
  const m = d.matrix || { platforms: [], airlines: [], data: [] };
  const matrixHtml = `
    <div class="heatmap" style="grid-template-columns: 80px repeat(${m.platforms.length}, 1fr); margin-top: 8px;">
      <div class="hm-cell empty"></div>
      ${m.platforms.map(p => `<div class="hm-cell head">${escapeHtml(p)}</div>`).join("")}
      ${m.airlines.map((air, i) => `
        <div class="hm-cell row-head">${escapeHtml(air)}</div>
        ${m.data.map(row => {
          const v = row[i];
          if (v == null) return `<div class="hm-cell empty"></div>`;
          return `<div class="hm-cell" data-tier="${tierOf(v)}">${fmtMinShort(v)}</div>`;
        }).join("")}
      `).join("")}
    </div>
    <div class="hm-legend">
      <span><span class="sw" style="background:rgba(255,71,87,0.4)"></span>&lt;2h（紧急）</span>
      <span><span class="sw" style="background:rgba(255,165,2,0.3)"></span>2-24h</span>
      <span><span class="sw" style="background:rgba(0,229,255,0.18)"></span>24-48h</span>
      <span><span class="sw" style="background:rgba(0,255,136,0.12)"></span>&gt;48h（充裕）</span>
    </div>
  `;

  // 各平台柱状图 (按时限短→长, max=24h 比例)
  const platMax = Math.max(1440, ...(d.by_platform || []).map(p => p.median_min));
  const platRows = (d.by_platform || []).map(p => {
    const pct = Math.min(100, p.median_min / platMax * 100);
    const cls = p.median_min < 240 ? "danger" : (p.median_min < 1440 ? "warn" : "");
    const color = p.median_min < 240 ? "#ff4757" : (p.median_min < 1440 ? "#ffa502" : "#00e5ff");
    return `
      <div class="bar-row">
        <div class="bar-name">${escapeHtml(p.platform)}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="bar-pct" style="color:${color}">${fmtMin(p.median_min)}</div>
      </div>`;
  }).join("");
  const platBarsHtml = `
    <div class="bars">${platRows}</div>
    <div class="note">⚠️ 时限短（红/橙）的平台接单后必须更快出票 — 携程/去哪儿 P10 较短说明接单可能滞后</div>
  `;

  // 时限紧迫度分布 (7 档)
  const distColors = [
    { k: "under_15min", name: "🚨 <15min", color: "#ff4757" },
    { k: "under_30min_minus_15", name: "🔴 15-30min", color: "#ff6b35", custom: true },
    { k: "under_1h_minus_30", name: "🟠 30-60min", color: "#ffa502", custom: true },
    { k: "1_3h", name: "🟡 1-3h", color: "#00e5ff" },
    { k: "3_12h", name: "🔵 3-12h", color: "#a855f7" },
    { k: "12_24h", name: "🟣 12-24h", color: "#7a8ba0" },
    { k: "over_24h", name: "🟢 >24h", color: "#00ff88" },
  ];
  const dist = d.distribution;
  const distRows = distColors.map(({ k, name, color, custom }) => {
    let n;
    if (custom) {
      if (k === "under_30min_minus_15") n = Math.max(0, dist.under_30min - dist.under_15min);
      else if (k === "under_1h_minus_30") n = Math.max(0, dist.under_1h - dist.under_30min);
    } else {
      n = dist[k] || 0;
    }
    const pct = n / d.count * 100;
    return `
      <div class="dist-row">
        <div class="dist-label">${name}</div>
        <div class="dist-track"><div class="dist-fill" style="width:${Math.max(pct, 0.5).toFixed(2)}%; background:${color}; color:${color}"></div></div>
        <div class="dist-pct" style="color:${color}">${n} 单</div>
      </div>`;
  }).join("");
  const distHtml = `
    <div class="bars">${distRows}</div>
    <div class="note">💡 业务关注：30-60min 区间（${(dist.under_1h - dist.under_30min)} 单）是日常出票窗口；&lt;30min 极少（${dist.under_30min} 单）说明接单到起飞前还有足够缓冲</div>
  `;

  // 各航司 Top 12 柱状图 (按时限短→长)
  const airTop = (d.by_airline || []).slice(0, 12);
  const airMax = Math.max(1440, ...airTop.map(a => a.median_min));
  const airRows = airTop.map(a => {
    const pct = Math.min(100, a.median_min / airMax * 100);
    const cls = a.median_min < 240 ? "danger" : (a.median_min < 1440 ? "warn" : "");
    const color = a.median_min < 240 ? "#ff4757" : (a.median_min < 1440 ? "#ffa502" : "#00e5ff");
    return `
      <div class="bar-row">
        <div class="bar-name">${escapeHtml(a.airline)}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="bar-pct" style="color:${color}">${fmtMin(a.median_min)}</div>
      </div>`;
  }).join("");
  const airBarsHtml = `
    <div class="bars">${airRows}</div>
    <div class="note">🚨 F9/W6/W4/PC/OD/FD 等廉航 → 中位时限 ≤ 142 min（2.4h），出票链路必须 &lt; 1h 才能留余量</div>
  `;

  const html = `
    <div class="section">
      <div class="section-title"><span class="anim-hero-mask">⏰ 产品时限分析</span> · ${monthLabel}
        <span class="badge badge-info">${fmt.num(d.count)} 单</span>
      </div>
      <div class="anim-tw" data-tw-text="公式：产品时限 = 最新截止日期 - 平台时间（单位：分钟）· 数字越小越紧迫 · P10 紧急区 = 10% 单的时限已 ≤ ${d.p10_min.toFixed(0)} min" style="margin-bottom:14px;padding:8px 12px;background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.15);border-radius:6px;font-size:12px"></div>
      <div class="kpi-row cols-4">${kpiHtml}</div>
    </div>

    <div class="section">
      <div class="section-title">🔥 平台 × 航司 矩阵（中位产品时限 · 分钟）
        <span class="badge badge-info">颜色越深越紧急</span>
      </div>
      ${matrixHtml}
    </div>

    <div class="grid-2">
      <div class="section">
        <div class="section-title">📊 各平台 中位产品时限
          <span class="badge badge-info">按时限短→长</span>
        </div>
        ${platBarsHtml}
      </div>
      <div class="section">
        <div class="section-title">⏱️ 时限紧迫度分布
          <span class="badge badge-info">${fmt.num(d.count)} 单</span>
        </div>
        ${distHtml}
      </div>
    </div>

    <div class="section">
      <div class="section-title">✈️ 各航司 中位产品时限（Top 12）
        <span class="badge badge-info">高风险航司（短时限）排前面</span>
      </div>
      ${airBarsHtml}
    </div>
  `;

  document.getElementById("mainArea").innerHTML = html;
}

/* ============================================================
 * 动效引擎 (Animations Engine)
 * 入口: AnimEngine.scan(root) — 由 MutationObserver 在
 *   mainArea 内容变化时自动调用 (DOM 重新渲染 = 重新扫描)
 *
 * 7 种动效激活条件:
 *   1. CountUp    — <.kpi-value data-count="123" data-count-dec="2" data-count-suf="%">
 *   2. Reveal-row — <tr class="anim-reveal" style="--w:80%"><span class="anim-bar"><i></i></span></tr>
 *   3. V3-bump    — AnimEngine.v3Bump(el) — 勾选/取消时手动调用
 *   4. Typewriter — <div class="anim-tw" data-tw-text="..."> 
 *   5. Hero-mask  — <span class="anim-hero-mask">文本</span>
 *   6. Stagger    — 父级 .anim-stagger-parent 内多个 .anim-stagger, 自动按 DOM 顺序延迟
 *   7. Aurora     — CSS only, body::before/::after 自动跑
 * ============================================================ */
const AnimEngine = (() => {
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const fmtNum = (n, dec) => {
    if (dec > 0) return n.toFixed(dec);
    return Math.round(n).toLocaleString();
  };

  // 1. CountUp
  function runCountUp(el) {
    if (el.dataset.counted) return;
    const target = parseFloat(el.dataset.count);
    if (isNaN(target)) return;
    const dur = parseInt(el.dataset.countDur || '2200');
    const dec = parseInt(el.dataset.countDec || '0');
    const pre = el.dataset.countPre || '';
    const suf = el.dataset.countSuf || '';
    const start = performance.now();
    el.textContent = pre + fmtNum(0, dec) + suf;
    function tick(now) {
      const t = Math.min((now - start) / dur, 1);
      el.textContent = pre + fmtNum(target * easeOutQuart(t), dec) + suf;
      if (t < 1) requestAnimationFrame(tick);
      else { el.classList.add('counted'); el.dataset.counted = '1'; }
    }
    requestAnimationFrame(tick);
  }

  // 4. Typewriter
  function runTypewriter(el) {
    if (el.dataset.twRun) return;
    el.dataset.twRun = '1';
    const text = el.dataset.twText || el.textContent.trim();
    el.innerHTML = '';
    const chars = [...text];
    chars.forEach((c, i) => {
      const s = document.createElement('span');
      s.className = 'tw-char';
      s.textContent = c === ' ' ? '\u00A0' : c;
      s.style.animationDelay = (i * 28) + 'ms';
      el.appendChild(s);
    });
    const cursor = document.createElement('span');
    cursor.className = 'tw-cursor';
    el.appendChild(cursor);
  }

  // Reveal / Stagger 观察器
  const revealObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      if (el.dataset.staggerIdx !== undefined) {
        const idx = parseInt(el.dataset.staggerIdx);
        setTimeout(() => el.classList.add('in'), idx * 70);
      } else {
        el.classList.add('in');
      }
      revealObs.unobserve(el);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });

  // CountUp / Typewriter 观察器 (延迟到元素进入视野)
  const triggerObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      if (el.dataset.count !== undefined && !el.dataset.counted) runCountUp(el);
      if (el.dataset.twText !== undefined && !el.dataset.twRun) runTypewriter(el);
      triggerObs.unobserve(el);
    });
  }, { threshold: 0.4 });

  function v3Bump(el) {
    if (!el) return;
    el.classList.remove('anim-v3-bump');
    void el.offsetWidth;  // reflow 强制重启动画
    el.classList.add('anim-v3-bump');
    setTimeout(() => el.classList.remove('anim-v3-bump'), 600);
  }

  // 7. Spotlight — 鼠标位置追踪 (bento + kpi-spotlight)
  function setupSpotlight(root) {
    if (!root) return;
    root.querySelectorAll('.kpi-spotlight, .bento').forEach(el => {
      if (el.dataset.spotBound) return;
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        el.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
      el.dataset.spotBound = '1';
    });
  }

  function scan(root) {
    if (!root) return;
    // 1. CountUp
    root.querySelectorAll('[data-count]').forEach(el => {
      if (!el.dataset.countBound) {
        triggerObs.observe(el);
        el.dataset.countBound = '1';
      }
    });
    // 6. Stagger 群组 (父级 .anim-stagger-parent 内所有 .anim-stagger)
    root.querySelectorAll('.anim-stagger-parent').forEach(parent => {
      const items = parent.querySelectorAll('.anim-stagger');
      items.forEach((el, i) => {
        if (el.dataset.staggerIdx === undefined) {
          el.dataset.staggerIdx = String(i);
          revealObs.observe(el);
        }
      });
    });
    // 2. Reveal row
    root.querySelectorAll('.anim-reveal').forEach(el => {
      if (!el.dataset.revealBound) {
        revealObs.observe(el);
        el.dataset.revealBound = '1';
      }
    });
    // 4. Typewriter
    root.querySelectorAll('[data-tw-text]').forEach(el => {
      if (!el.dataset.twBound) {
        triggerObs.observe(el);
        el.dataset.twBound = '1';
      }
    });
    // 7. Spotlight 鼠标追踪
    setupSpotlight(root);
  }

  return { scan, v3Bump, runCountUp, runTypewriter, setupSpotlight };
})();

// 监听 mainArea 变化自动扫描 (每次 renderXxx 都会触发)
(function setupAnimAutoScan() {
  const main = document.getElementById('mainArea');
  if (!main) return;
  let raf = null;
  const mo = new MutationObserver(() => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      AnimEngine.scan(main);
    });
  });
  mo.observe(main, { childList: true, subtree: true });
})();
</script>

<!-- ============================================================
 * 2026-08-05 页面视图统一（4 个调整，按用户偏好"换皮不动布局"）
 *   A. 标题装饰条: 已有 ::after 装饰条, 加 inset border-bottom 让层级更清晰
 *   B. 圆角统一: .section/.chart-box 18→16, .nav-item 10→16 (其他保持)
 *   C. KPI 副标题强化: .kpi-sub + .cmp-badge 加 cyan glow + tabular-nums

 * ============================================================ -->
<style>
  /* B. 圆角统一 16px (覆盖前面的 18px / 10px) */
  .section, .chart-box { border-radius: 16px !important; }
  .nav-item { border-radius: 12px !important; }   /* nav-item 太小, 提到 12px 平衡感 */

  /* C. KPI 副标题行统一风格 */

    font-variant-numeric: tabular-nums !important;  /* 等宽数字, 涨跌对齐 */
    letter-spacing: 0.3px !important;

  }
  .cmp-badge {
    font-variant-numeric: tabular-nums !important;
    letter-spacing: 0.3px !important;

    transition: text-shadow 0.3s ease !important;
  }
  /* 副标题行整体: 行高 + 间距统一 */

  }

  /* D. 导航高亮强化: 当前页左侧 cyan 竖条 + 强 glow */
  .nav-item {
    position: relative !important;
    padding-left: 16px !important;  /* 给竖条留位置 (从 12px 增到 16px) */
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }
  .nav-item::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%) scaleY(0);
    width: 3px;
    height: 60%;
    background: #00e5ff;
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .nav-item.active::before {
    transform: translateY(-50%) scaleY(1);
  }
  .nav-item.active {
    box-shadow:
      0 0 20px rgba(0, 229, 255, 0.25),
      inset 0 0 0 1px rgba(0, 229, 255, 0.15) !important;
  }
  .nav-item:hover {
    background: rgba(0, 229, 255, 0.08) !important;
    border-color: rgba(0, 229, 255, 0.3) !important;
    transform: translateX(2px);
  }
  .nav-item:not(.active):hover::before {
    transform: translateY(-50%) scaleY(0.5);
    opacity: 0.5;
  }
</style>

<!-- ============================================================
 * 2026-08-05 背景去花（3 个调整全做）
 *   根因: 之前为让 aurora 透出把 .layout 改 z-index: auto + 玻璃卡片透明度 0.6/0.5
 *         → 100vw 撑满后 aurora 在主区大块透出, 紫色光晕盖住卡片, 看起来"花"
 *   A. 强化主区背景: 玻璃卡片 0.6/0.5 → 0.88/0.85 实色化, 主区压住 aurora
 *   B. 降 aurora 不透明度: aurora-3rd 0.9/0.5/0.2 → 0.5/0.3/0.1, blur 35→40
 *                  body::before 0.9→0.55, body::after 0.8→0.45, blur 50→40
 *   C. 主区背景加柔化磨砂: .layout::before 加 radial-gradient 柔化层,
 *                  中心 rgba(10,14,26,0.92) 实色, 边缘 transparent, 让 aurora 仅在边缘透出
 * ============================================================ -->
<style>
  /* A. 强化主区背景 - 玻璃卡片实色化 (覆盖前面的 0.6/0.5) */
  .section, .sidebar, .kpi, .chart-box, .nav-section, .nav-mini {
    background: linear-gradient(135deg, rgba(15, 22, 38, 0.88) 0%, rgba(10, 14, 26, 0.85) 100%) !important;
  }
  .month-switcher {
    background: linear-gradient(135deg, rgba(15, 22, 38, 0.92) 0%, rgba(10, 14, 26, 0.88) 100%) !important;
  }

  /* B. 降 aurora 不透明度 (让 aurora 仅作为边缘"暗示", 不抢主区) - 2026-08-05 再降一档 */
  /*    body::before 青色右上 */
  body::before {
    background: radial-gradient(circle, rgba(0, 229, 255, 0.4) 0%, rgba(0, 229, 255, 0.12) 40%, transparent 70%) !important;
    filter: blur(45px) !important;
  }
  /*    body::after 紫色左下 */
  body::after {
    background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(168, 85, 247, 0.1) 40%, transparent 70%) !important;
    filter: blur(45px) !important;
  }
  /*    aurora-3rd 粉色右下 */
  .aurora-3rd {
    background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(236, 72, 153, 0.2) 30%, rgba(236, 72, 153, 0.05) 55%, transparent 75%) !important;
    filter: blur(45px) !important;
  }

  /* C. 主区背景加柔化磨砂 - 2026-08-05 更实, 仅边缘 8% 极淡透出 aurora */
  .layout {
    position: relative !important;  /* 覆盖前面 .layout 不形成 stacking context 的设置 */
  }
  .layout::before {
    content: "";
    position: fixed;
    top: 0;
    left: 240px;  /* 避开侧栏 (sidebar 200px + gap 16px + 24px padding buffer) */
    right: 0;
    bottom: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(10, 14, 26, 0.97) 0%,
      rgba(10, 14, 26, 0.92) 50%,
      rgba(10, 14, 26, 0.7) 85%,
      transparent 100%
    );
    pointer-events: none;
    z-index: -1;
  }
</style>
</body>
</html>

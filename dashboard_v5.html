<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>出票自动化监控平台</title>
<!-- 2026-07-31: 删 Google Fonts 外部依赖，部署后网络隔离/超时会导致字体 fallback，KPI 字距错乱
     改用系统字体栈（Segoe UI / 微软雅黑 / Consolas），保证本地 = 部署一致 -->
<style>html, body { background: #0a0e1a; margin: 0; }</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/echarts@5/dist/echarts.min.js'"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0e1a;
    color: #e0e6f0;
    padding: 0;            /* 2026-07-31: 去掉 20px 内边距，撑满 Streamlit iframe 100vw */
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  /* Outfit 应用范围: 数字/英文/标题优先, 中文 fallback */
  .title, .section-title, .kpi-value, .kpi-label, .hero-stat-value, .kpi-spotlight-value, .bento-big-num, .lamp-line h2 {
    font-family: 'Segoe UI', "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* JetBrains Mono 用于纯数字 (KPI 数字) */
  .kpi-value, .hero-stat-value, .kpi-spotlight-value, .bento-big-num, td.numeric, .cmp-badge, .kpi-sub {
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', 'Segoe UI', monospace;
  }
  /* 自适应：屏幕很宽（>1750px）时让布局居中避免拉伸 */
  .layout-wrapper {
    max-width: 100%;
  }
  .title {
    text-align: center;
    color: #00e5ff;
    font-size: 26px;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .subtitle {
    text-align: center;
    color: #7a8ba0;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 16px;
    width: 100vw;          /* 2026-07-31: 强制 100vw 撑满，避开 streamlit 1.58 的 736px 限制 */
    max-width: 100vw;
    margin: 0;
    padding: 0;
  }
  /* grid 子项 min-width: 0 — 防止 ECharts / KPI 文字撑爆列宽导致偏移 */
  .layout > * { min-width: 0; }
  /* 自适应：超窄屏（<900px）侧边栏与主区上下排版，避免挤压 */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .sidebar {
    background: #0f1626;
    border: 1px solid #1e3a5f;
    border-radius: 10px;
    padding: 14px;
    height: fit-content;
    position: sticky;
    top: 20px;
  }
  .logo {
    color: #00e5ff;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1e3a5f;
  }
  .nav-item {
    padding: 10px 12px;
    margin-bottom: 5px;
    background: #131c30;
    border: 1px solid #1e3a5f;
    border-radius: 6px;
    color: #b0c4de;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-item:hover { border-color: #00e5ff; }
  .nav-item.active {
    background: linear-gradient(135deg, #0a1a2e, #131c30);
    border-color: #00e5ff;
    color: #00e5ff;
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
  }
  .nav-section {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid #1e3a5f;
  }
  .nav-section-title {
    font-size: 10px;
    color: #5a6b80;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .nav-mini {
    padding: 7px 11px;
    font-size: 11px;
    background: #0a0e1a;
    border: 1px solid #1e3a5f;
    border-radius: 4px;
    color: #7a8ba0;
    margin-bottom: 4px;
  }
  .main { display: flex; flex-direction: column; gap: 16px; }
  .section {
    background: #0f1626;
    border: 1px solid #1e3a5f;
    border-radius: 10px;
    padding: 18px;
  }
  .section-title {
    color: #00e5ff;
    font-size: 15px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .section-title::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 16px;
    background: #00e5ff;
    border-radius: 2px;
  }
  .section-title .badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }
  .badge-warn { background: #ffa50220; color: #ffa502; border: 1px solid #ffa50240; }
  .badge-danger { background: #ff475720; color: #ff4757; border: 1px solid #ff475740; }
  .badge-info { background: #00e5ff20; color: #00e5ff; border: 1px solid #00e5ff40; }
  .badge-success { background: #00ff8820; color: #00ff88; border: 1px solid #00ff8840; }
  .kpi-row {
    display: grid;
    gap: 12px;
  }
  .kpi-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .kpi-row.cols-5 { grid-template-columns: repeat(5, 1fr); }
  .kpi-row.cols-6 { grid-template-columns: repeat(6, 1fr); }
  .kpi-row.cols-7 { grid-template-columns: repeat(7, 1fr); }
  .kpi {
    background: #131c30;
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 14px;
    position: relative;
    transition: all 0.2s;
  }
  .kpi:hover { border-color: #00e5ff; transform: translateY(-2px); }
  .kpi.warning { border-color: #ffa50280; }
  .kpi.danger { border-color: #ff475780; }
  .kpi.success { border-color: #00ff8880; }
  /* 2026-07-20 新增: KPI 卡片颜色按对比变化动态切换
   * 正向指标 (good): 涨=绿(up-good) 跌=红(down-good) 不变=黄(flat)
   * 负向指标 (bad) : 涨=红(up-bad)  跌=绿(down-bad)  不变=黄(flat)
   * 用法: <div class="kpi up-good"> 或 <div class="kpi down-bad"> ...
   */
  .kpi.up-good { border-color: #00ff8880; }
  .kpi.up-good .kpi-value { color: #00ff88; }
  .kpi.up-bad { border-color: #ff475780; }
  .kpi.up-bad .kpi-value { color: #ff4757; }
  .kpi.down-good { border-color: #ff475780; }
  .kpi.down-good .kpi-value { color: #ff4757; }
  .kpi.down-bad { border-color: #00ff8880; }
  .kpi.down-bad .kpi-value { color: #00ff88; }
  .kpi.flat { border-color: #ffa50280; }
  .kpi.flat .kpi-value { color: #ffa502; }
  .kpi-label {
    color: #7a8ba0;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
  }
  .kpi-value.green { color: #00ff88; }
  .kpi-value.red { color: #ff4757; }
  .kpi-value.yellow { color: #ffa502; }
  .kpi-sub {
    font-family: 'Segoe UI', "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    color: rgba(192, 200, 212, 0.82);
    margin-top: 6px;
    letter-spacing: 0.3px;
    text-shadow: 0 0 4px rgba(0, 229, 255, 0.08);
  }
  .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-1x2 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .grid-1x3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  /* 10. 产品时限分析（deadline 页, 2026-07-30 新增）— 热力图 + 柱状图 + 分布 */
  .heatmap { display: grid; gap: 3px; font-family: 'Cascadia Code', 'Consolas', 'Courier New', 'Segoe UI', monospace; font-size: 11px; }
  .hm-cell { padding: 6px 8px; text-align: center; border-radius: 4px; background: rgba(15,22,38,0.6); color: rgba(224,230,240,0.95); border: 1px solid rgba(255,255,255,0.04); }
  .hm-cell.empty { background: transparent; border: none; }
  .hm-cell.head  { background: transparent; border: none; color: #00e5ff; font-weight: 600; }
  .hm-cell.row-head { background: transparent; border: none; color: #c0c8d4; text-align: right; font-weight: 600; }
  .hm-cell[data-tier="1"] { background: rgba(255,71,87,0.4); border-color: rgba(255,71,87,0.5); text-shadow: 0 0 6px rgba(255,71,87,0.6); }
  .hm-cell[data-tier="2"] { background: rgba(255,165,2,0.3); border-color: rgba(255,165,2,0.4); }
  .hm-cell[data-tier="3"] { background: rgba(0,229,255,0.18); border-color: rgba(0,229,255,0.25); }
  .hm-cell[data-tier="4"] { background: rgba(0,255,136,0.12); border-color: rgba(0,255,136,0.2); }
  .hm-legend { display: flex; align-items: center; gap: 14px; margin-top: 10px; font-size: 11px; color: rgba(192,200,212,0.75); flex-wrap: wrap; }
  .hm-legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 90px; align-items: center; gap: 10px; font-size: 12px; }
  .bar-name { color: #c0c8d4; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { position: relative; height: 18px; background: rgba(15,22,38,0.55); border-radius: 9px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 9px; background: linear-gradient(90deg, #00e5ff 0%, #a855f7 100%); box-shadow: 0 0 12px rgba(0,229,255,0.4); position: relative; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
  .bar-fill.warn { background: linear-gradient(90deg, #ffa502 0%, #ff6b35 100%); box-shadow: 0 0 12px rgba(255,165,2,0.5); }
  .bar-fill.danger { background: linear-gradient(90deg, #ff4757 0%, #c0392b 100%); box-shadow: 0 0 12px rgba(255,71,87,0.5); }
  .bar-pct { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; color: #00e5ff; text-shadow: 0 0 8px rgba(0,229,255,0.5); font-weight: 600; font-size: 11px; }

  .dist-row { display: grid; grid-template-columns: 100px 1fr 80px; align-items: center; gap: 10px; padding: 6px 0; font-size: 12px; }
  .dist-label { color: #c0c8d4; }
  .dist-track { position: relative; height: 14px; background: rgba(15,22,38,0.55); border-radius: 7px; overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 7px; box-shadow: 0 0 10px currentColor; }
  .dist-pct { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-weight: 600; text-align: right; }

  .note { font-size: 11px; color: rgba(148,163,184,0.7); padding: 8px 12px; background: rgba(0,229,255,0.04); border: 1px solid rgba(0,229,255,0.12); border-radius: 6px; margin-top: 10px; line-height: 1.6; }
  .chart-box {
    background: #131c30;
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 14px;
  }
  .chart-title {
    color: #b0c4de;
    font-size: 13px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chart-area { width: 100%; }
  /* 2026-07-21: 员工页 3 张全量排行榜表（接单/全自动失败/订单转人工） */
  .kpi.rank-card { padding: 12px 14px; }
  .kpi.rank-card .rank-list {
    display: flex; flex-direction: column; gap: 5px; margin-top: 8px;
  }
  .kpi.rank-card .rank-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px 5px 6px; border-radius: 4px;
    background: #0d1424; font-size: 13px;
  }
  .kpi.rank-card .rank-row.gold {
    background: linear-gradient(90deg, #2a2410 0%, #131c30 100%);
    border-left: 3px solid #ffd700;
  }
  .kpi.rank-card .rank-row.silver {
    background: linear-gradient(90deg, #1a2030 0%, #131c30 100%);
    border-left: 3px solid #c0c0c0;
  }
  .kpi.rank-card .rank-row.bronze {
    background: linear-gradient(90deg, #1f1a14 0%, #131c30 100%);
    border-left: 3px solid #cd7f32;
  }
  .kpi.rank-card .rank-medal { font-size: 14px; min-width: 18px; text-align: center; }
  .kpi.rank-card .rank-name { flex: 1; color: #e0e6f0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi.rank-card .rank-value { color: #00e5ff; font-weight: 700; font-size: 13px; }
  .kpi.rank-card .rank-value.green { color: #00ff88; }
  .kpi.rank-card .rank-empty { color: #7a8ba0; font-size: 12px; text-align: center; padding: 14px 0; }
  .kpi.rank-card .rank-sub { color: #7a8ba0; font-size: 10px; margin-top: 8px; line-height: 1.5; }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  /* 失败根因下钻面板 */
  .drill-row { background: #0a1424; }
  .drill-row:hover { background: #0a1424; }
  .drill-panel { padding: 12px 18px; background: #0a1424; border-left: 3px solid #00e5ff; }
  .drill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .drill-title { font-size: 14px; font-weight: 600; }
  .drill-close { background: transparent; border: 1px solid #2a4a6e; color: #b0c4de; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .drill-close:hover { background: #1e3a5f; color: #fff; }
  .drill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .drill-chart { background: #0a1a2e; border: 1px solid #1e3a5f; border-radius: 6px; padding: 10px; }
  .drill-wide { grid-column: 1 / -1; }
  .drill-chart-title { color: #00e5ff; font-size: 12px; font-weight: 600; margin-bottom: 8px; padding-left: 4px; border-left: 2px solid #00e5ff; }
  .family-subtable { margin-top: 8px; }
  .family-subtable .data-table { font-size: 11px; }
  /* 2026-07-21: 员工页 3 张全量排行榜表（紧凑版） */
  .data-table.compact { font-size: 11px; }
  .data-table.compact th { padding: 5px 6px; }
  .data-table.compact td { padding: 4px 6px; }
  .data-table.compact .rank-num { color: #7a8ba0; width: 28px; text-align: center; }
  .data-table.compact .rank-num.top1 { color: #ffd700; font-weight: 700; }
  .data-table.compact .rank-num.top2 { color: #c0c0c0; font-weight: 700; }
  .data-table.compact .rank-num.top3 { color: #cd7f32; font-weight: 700; }
  .data-table.compact .rank-val { text-align: right; font-weight: 600; }
  .data-table.compact tr:hover td { background: #0d1424; }
  /* 4 路径对比表（紧凑版） */
  .path-compare-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
  .path-compare-table th { padding: 5px 8px; color: #7a8ba0; font-weight: 500; border-bottom: 1px solid #1e3a5f; background: #0a0e1a; text-align: right; }
  .path-compare-table th:first-child { text-align: left; }
  .path-compare-table td { padding: 5px 8px; border-bottom: 1px solid #1e3a5f40; color: #b0c4de; text-align: right; }
  .path-compare-table td:first-child { text-align: left; font-weight: 600; }
  .drill-btn { background: #0a1a2e; border: 1px solid #1e3a5f; color: #00e5ff; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .drill-btn:hover { background: #1e3a5f; color: #fff; }
  .data-table th {
    text-align: left;
    padding: 8px 10px;
    color: #7a8ba0;
    font-weight: 500;
    border-bottom: 1px solid #1e3a5f;
    background: #0a0e1a;
    position: sticky;
    top: 0;
  }
  .data-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #1e3a5f;
    color: #b0c4de;
  }
  .data-table tr:hover td { background: #0a1a2e; }
  .insight-box {
    background: linear-gradient(90deg, #ff475715, #ff475705);
    border-left: 3px solid #ff4757;
    padding: 10px 14px;
    border-radius: 4px;
    color: #b0c4de;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .insight-box.warning {
    background: linear-gradient(90deg, #ffa50215, #ffa50205);
    border-left-color: #ffa502;
  }
  .insight-box.warning .insight-title { color: #ffa502; }
  .insight-box.info {
    background: linear-gradient(90deg, #00e5ff15, #00e5ff05);
    border-left-color: #00e5ff;
  }
  .insight-box.info .insight-title { color: #00e5ff; }
  .insight-box.success {
    background: linear-gradient(90deg, #00ff8815, #00ff8805);
    border-left-color: #00ff88;
  }
  .insight-box.success .insight-title { color: #00ff88; }
  .insight-title { color: #ff4757; font-weight: 600; margin-bottom: 4px; }
  .data-overview {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    background: #0a0e1a;
    border: 1px solid #1e3a5f;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: #7a8ba0;
    margin-bottom: 12px;
  }
  .data-overview b { color: #00e5ff; }
  .pos { color: #00ff88; }
  .neg { color: #ff4757; }
  /* D30：各平台对比前日 表格 涨/降/不变 配色 */
  .delta-pos { color: #00ff88; font-size: 11px; }
  .delta-neg { color: #ff4757; font-size: 11px; }
  .delta-zero { color: #7a8ba0; font-size: 11px; }
  .delta-cell { line-height: 1.5; }
  /* 2026-07-21: 加载占位改 spinner + 大文字，更醒目 */
  .loading {
    color: #00e5ff;
    text-align: center;
    padding: 120px 20px;
    font-size: 16px;
  }
  .loading-spinner {
    display: inline-block;
    width: 56px;
    height: 56px;
    border: 4px solid #1e3a5f;
    border-top-color: #00e5ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  .loading-text { color: #00e5ff; font-size: 18px; font-weight: 600; letter-spacing: 1px; }
  .loading-sub { color: #7a8ba0; font-size: 12px; margin-top: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 月份切换器 — 玻璃化升级 (跟 section/kpi 统一) */
  .month-switcher {
    background: linear-gradient(135deg, rgba(15, 22, 38, 0.6) 0%, rgba(10, 14, 26, 0.5) 100%);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 1px 0 rgba(255, 255, 255, 0.04) inset;
    position: relative;
    overflow: hidden;
  }
  .month-switcher::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.4), transparent);
  }
  .month-switcher label {
    color: #00e5ff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .month-switcher select {
    background: rgba(15, 22, 38, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e0e6f0;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    outline: none;
    transition: all 0.2s;
  }
  .month-switcher select:hover {
    border-color: rgba(0, 229, 255, 0.3);
    background: rgba(15, 22, 38, 0.85);
  }
  .month-switcher .month-info {
    color: #7a8ba0;
    font-size: 13px;
    margin-left: auto;
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', 'Courier New', monospace;
  }
  .month-switcher .month-info b {
    color: #00e5ff;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #7a8ba0;
  }
  .empty-state h2 { color: #00e5ff; margin-bottom: 12px; }
  .empty-state code {
    background: #0a0e1a;

  .cmp-badge {

  /* ============================================================
   * Aceternity 视觉升级 (2026-07-30)
   * 全局 8 页统一: 玻璃卡片 + 明显 Aurora + 圆角加大 + 柔边框
   * 思路: 在原 CSS 之后追加 override, 同优先级靠后覆盖
   * 保持所有动态 class (up-good/down-bad 等) 的颜色逻辑
   * ============================================================ */
  body { background: #050816; }  /* 底色加深, 让 aurora 更明显 */

  /* 明显 Aurora — 3 团色 (青+紫+粉), 透明度调高 + 尺寸加大 + blur 收紧 */
  body::before, body::after { content: ''; position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; }
  body::before {
    top: -200px; right: -200px;
    width: 1100px; height: 1100px;
    background: radial-gradient(circle, rgba(0, 229, 255, 0.9) 0%, rgba(0, 229, 255, 0.3) 40%, transparent 70%);
    filter: blur(50px);
  }
  body::after {
    bottom: -200px; left: -200px;
    width: 1100px; height: 1100px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.8) 0%, rgba(168, 85, 247, 0.25) 40%, transparent 70%);
    filter: blur(50px);
  }
  /* 第 3 团: 粉色 (右下) — 2026-07-31 加强: 100vw 撑满后粉色被 chart-box 半透明盖住，
     不透明度 0.6→0.9，中圈 0.2→0.5，blur 50→35 让光晕更集中更亮 */
  .aurora-3rd {
    position: fixed;
    bottom: -150px; right: 8%;
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.9) 0%, rgba(236, 72, 153, 0.5) 30%, rgba(236, 72, 153, 0.2) 55%, transparent 75%);
    filter: blur(35px);
    pointer-events: none;
    z-index: 0;
  }

  /* 玻璃卡片 — 渐变背景 + neumorphic 多层阴影 + 顶部高光线 (透明度调低让 aurora 透过来) */
  .section, .sidebar, .kpi, .chart-box, .nav-section, .nav-mini {
    background: linear-gradient(135deg, rgba(15, 22, 38, 0.6) 0%, rgba(10, 14, 26, 0.5) 100%);
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 1px 0 rgba(255, 255, 255, 0.04) inset;
  }
  .section, .chart-box { border-radius: 18px; padding: 24px; position: relative; overflow: hidden; }
  .section::before, .chart-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(0, 229, 255, 0.4) 50%, transparent 100%);
    pointer-events: none;
  }
  .kpi { border-radius: 16px; padding: 20px; transition: all 0.3s; position: relative; overflow: hidden; }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(0, 229, 255, 0.3) 50%, transparent 100%);
    pointer-events: none;
  }
  .kpi:hover { transform: translateY(-4px); border-color: rgba(0, 229, 255, 0.5); box-shadow: 0 8px 32px rgba(0, 229, 255, 0.2), 0 0 0 1px rgba(0, 229, 255, 0.1); }
  .sidebar, .nav-section, .nav-mini { border-radius: 16px; }

  /* KPI 数字 — 加大字号 + 强 glow (纯白底, 渐变会糊掉) */
  .kpi-value {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
    text-shadow: 0 0 18px rgba(0, 229, 255, 0.65), 0 0 40px rgba(0, 229, 255, 0.35), 0 0 80px rgba(0, 229, 255, 0.15);
    transition: transform 0.2s;
  }
  .kpi:hover .kpi-value { transform: scale(1.06); }
  .kpi-value.green { color: #00ff88; text-shadow: 0 0 18px rgba(0, 255, 136, 0.75), 0 0 40px rgba(0, 255, 136, 0.4), 0 0 80px rgba(0, 255, 136, 0.18); }
  .kpi-value.red   { color: #ff4757; text-shadow: 0 0 18px rgba(255, 71, 87, 0.75), 0 0 40px rgba(255, 71, 87, 0.4), 0 0 80px rgba(255, 71, 87, 0.18); }
  .kpi-value.yellow{ color: #ffa502; text-shadow: 0 0 18px rgba(255, 165, 2, 0.75), 0 0 40px rgba(255, 165, 2, 0.4), 0 0 80px rgba(255, 165, 2, 0.18); }

  /* 动态颜色 (up-good / down-bad) 保留 — 只需让 border-color + value color 仍生效 */
  .kpi.up-good, .kpi.down-bad { border-color: rgba(0, 255, 136, 0.35) !important; }
  .kpi.up-bad, .kpi.down-good { border-color: rgba(255, 71, 87, 0.35) !important; }
  .kpi.flat, .kpi.warning { border-color: rgba(255, 165, 2, 0.35) !important; }

  /* 标题加粗 + 青色 (用户原配色) + 底部高亮线 */
  .section-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #00e5ff;
    margin-bottom: 18px;
    padding-bottom: 12px;
    position: relative;
  }
  .section-title::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 80px; height: 2px;
    background: linear-gradient(90deg, #00e5ff 0%, transparent 100%);
    border-radius: 2px;
  }

  /* 主标题 (顶部 "出票自动化监控平台") 横向渐变 + 动画 (青→紫, 保留青色基调) */
  .title {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00e5ff 0%, #00e5ff 45%, #a855f7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% 100%;
    text-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
  }
      50% { background-position: 100% 50%; }
  }

  /* 导航项玻璃化 */
  .nav-item {
    background: rgba(15, 22, 38, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
  }
  .nav-item.active {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(168, 85, 247, 0.1));
    border-color: rgba(0, 229, 255, 0.4);
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
  }

  /* 徽章玻璃化 — 提升可见度 */
  .badge {
    background: rgba(15, 22, 38, 0.6) !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    color: #cbd5e1 !important;
  }
  .badge-info {
    background: rgba(0, 229, 255, 0.12) !important;
    color: #00e5ff !important;
    border: 1px solid rgba(0, 229, 255, 0.4) !important;
  }

  /* 表格轻玻璃化 (不破坏结构) */
  .data-table, .path-compare-table, .detail-table {
    background: rgba(10, 14, 26, 0.3);
    border-radius: 8px;
  }
  .data-table thead, .path-compare-table thead, .detail-table thead {
    background: rgba(0, 229, 255, 0.06);
  }

  /* 输入/下拉玻璃化 — 容器已升级, select 留 0 行 (避免重复定义) */

  /* 路径快速卡 (overview 4 路径饼图右侧) */
  .path-stat-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(10, 14, 26, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 3px solid var(--c, #00e5ff);
    border-radius: 8px;
    transition: all 0.2s;
  }
  .path-stat-card:hover {
    background: rgba(0, 229, 255, 0.04);
    transform: translateX(2px);
  }
  .path-stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--c, #00e5ff);
    box-shadow: 0 0 8px var(--c, #00e5ff);
    flex-shrink: 0;
  }
  .path-stat-body { flex: 1; min-width: 0; }
  .path-stat-name { font-size: 13px; color: #e0e6f0; font-weight: 600; margin-bottom: 4px; }
  .path-stat-meta { font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .path-stat-meta .cmp-badge { font-size: 11px; padding: 1px 5px; }

  /* ============================================================
   * 动效系统 (Animations Engine v1)
   * 7 种动效: CountUp / Reveal-row / V3-bump / Typewriter /
   *          Hero-mask / Stagger / Aurora+flow
   * 通过 data-count / .anim-reveal / .anim-stagger / data-tw-text
   *    / .anim-hero-mask 等属性自动触发
   * 由 AnimEngine.scan() 在 mainArea 变化时扫描激活
   * ============================================================ */
  @keyframes tw-char-in { to { opacity: 1; } }
  @keyframes tw-blink { 50%, 100% { opacity: 0; } 50.01% { opacity: 1; } }
      100% { -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 100%, transparent 100%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, #000 100%, transparent 100%, transparent 100%); }
  }
  @keyframes v3-bump-anim { 0% { transform: scale(1); } 50% { transform: scale(1.25); color: #00e5ff; text-shadow: 0 0 24px rgba(0, 229, 255, 0.7); } 100% { transform: scale(1); } }
  @keyframes count-bump-anim { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
      /* 1. CountUp — 数字带 data-count 走 tabular-nums */
  .kpi-value[data-count] { font-variant-numeric: tabular-nums; }
  .kpi-value.counted { animation: count-bump-anim 0.4s ease; }

  /* 2. Reveal row (失败根因表行渐入 + 进度条) */
  .anim-reveal { opacity: 0; transform: translateX(-16px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .anim-reveal.in { opacity: 1; transform: translateX(0); }
  .anim-reveal .anim-bar { display: block; height: 3px; background: rgba(0,229,255,0.06); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .anim-reveal .anim-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #00e5ff, #a855f7); transition: width 1.2s cubic-bezier(0.25,1,0.5,1) 0.2s; border-radius: 2px; box-shadow: 0 0 6px rgba(0,229,255,0.4); }
  .anim-reveal.in .anim-bar > i { width: var(--w, 0%); }

  /* 3. Stagger 卡片 (8 大环节) */
  .anim-stagger { opacity: 0; transform: translateY(16px) scale(0.97); transition: opacity 0.5s ease, transform 0.5s ease; }
  .anim-stagger.in { opacity: 1; transform: translateY(0) scale(1); }

  /* 4. Hero mask (大标题从左揭开) */
  .anim-hero-mask {
    display: inline-block;
    background: linear-gradient(135deg, #fff 0%, #00e5ff 60%, #a855f7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 0%, transparent 0%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 0%, #000 0%, transparent 0%, transparent 100%);
  }

  /* 5. Typewriter */
  .anim-tw { font-size: 13px; color: #94a3b8; line-height: 1.7; min-height: 22px; }
  .anim-tw .tw-char { opacity: 0; display: inline-block; animation: tw-char-in 0.04s forwards; }
  .anim-tw .tw-cursor { display: inline-block; width: 2px; height: 1em; background: #00e5ff; margin-left: 2px; vertical-align: -2px; animation: tw-blink 1s step-end infinite; }

  /* 6. V3 bump (数字 scale 反馈) */
  .anim-v3-bump { animation: v3-bump-anim 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* 7. V3 勾选列表 — 行式布局 (失败分析 V3 5 数字卡下方) */
  .aa-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }
  .aa-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(15, 22, 38, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .aa-row:hover {
    background: rgba(15, 22, 38, 0.6);
    border-color: rgba(255, 255, 255, 0.1);
  }
  /* 选中状态: 用 :has() 监听 input checked, 整体青色高光 */
  .aa-row:has(.aa-pick:checked) {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.14) 0%, rgba(0, 229, 255, 0.06) 100%);
    border-color: rgba(0, 229, 255, 0.5);
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.15), inset 0 0 0 1px rgba(0, 229, 255, 0.2);
  }
  .aa-row .aa-pick {
    width: 16px;
    height: 16px;
    accent-color: #00e5ff;
    cursor: pointer;
    flex-shrink: 0;
  }
  .aa-row-reason {
    flex: 1;
    color: #c0c8d4;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .aa-row-total {
    color: #7a8ba0;
    font-size: 13px;
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', 'Courier New', monospace;
    font-weight: 600;
    flex-shrink: 0;
  }
  .aa-row:has(.aa-pick:checked) .aa-row-reason { color: #ffffff; }
  .aa-row:has(.aa-pick:checked) .aa-row-total {
    color: #00e5ff;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
  }

  /* 8. V1 基期对比分析 — 行式列表 (跟 V3 .aa-row 风格统一) */
  .v1-block {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
  }
  .v1-block:first-of-type {
    margin-top: 12px;
    padding-top: 0;
    border-top: none;
  }
  .v1-block-title {
    font-family: 'Segoe UI', sans-serif;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    position: relative;
    padding-left: 12px;
    letter-spacing: 0.5px;
  }
  .v1-block-title::before {
    content: '';
    position: absolute;
    left: 0; top: 4px; bottom: 4px;
    width: 3px;
    border-radius: 2px;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .v1-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .v1-row {
    display: grid;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: rgba(15, 22, 38, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    font-size: 13px;
    transition: all 0.15s;
  }
  .v1-row:hover {
    background: rgba(15, 22, 38, 0.6);
    border-color: rgba(255, 255, 255, 0.1);
  }
  .v1-row-2col { grid-template-columns: 1fr 60px; }
  .v1-row-5col { grid-template-columns: 1fr 55px 60px 60px 60px; }
  .v1-reason {
    color: #c0c8d4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .v1-num {
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', 'Courier New', monospace;
    font-weight: 600;
    text-align: right;
    font-size: 13px;
  }
  .v1-num-current { color: #00e5ff; text-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }
  .v1-num-prev { color: #7a8ba0; }
  .v1-num-bad { color: #ff4757; text-shadow: 0 0 8px rgba(255, 71, 87, 0.3); }
  .v1-num-good { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.3); }
  .v1-num-warn { color: #a855f7; text-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }

  /* 9. 自动化成功率排行 (overview 新增 section, 航司/渠道各一个 section, 目标 83%, 全量降序) */
  .succ-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 720px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .succ-list::-webkit-scrollbar { width: 6px; }
  .succ-list::-webkit-scrollbar-track { background: rgba(15, 22, 38, 0.4); border-radius: 3px; }
  .succ-list::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 3px; }
  .succ-row {
    display: grid;
    grid-template-columns: 140px 1fr 70px 130px;
    align-items: center;
    gap: 14px;
    padding: 12px 12px 8px 12px;
    background: rgba(15, 22, 38, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    font-size: 12px;
    transition: all 0.15s;
  }
  .succ-row:hover {
    background: rgba(15, 22, 38, 0.6);
    border-color: rgba(255, 255, 255, 0.1);
  }
  .succ-name {
    color: #c0c8d4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    font-weight: 500;
  }
  .succ-bar {
    height: 10px;
    background: rgba(15, 22, 38, 0.6);
    border-radius: 5px;
    overflow: visible;
    position: relative;
  }
  .succ-fill {
    height: 100%;
    border-radius: 5px;
    width: 0;  /* 初始 0, IntersectionObserver 触发后设 width: data-target% */
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    z-index: 1;
  }
  .succ-target-line {
    position: absolute;
    top: -4px; bottom: -4px;
    width: 3px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.65));
    z-index: 3;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 4px rgba(0, 229, 255, 0.4);
    border-radius: 1px;
  }
  /* 目标线顶部 ▼ 三角（提示这是 83% 目标线，不挡进度条） */
  .succ-target-line::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid #fff;
    filter: drop-shadow(0 0 3px rgba(0, 229, 255, 0.8));
  }
  .succ-pct {
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', 'Courier New', monospace;
    font-weight: 600;
    text-align: right;
    font-size: 13px;
  }
  .succ-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
    border: 1px solid;
    text-align: center;
    background: rgba(15, 22, 38, 0.3);
    font-family: 'Segoe UI', sans-serif;
    letter-spacing: 0.3px;
  }
  .succ-perfect .succ-badge { background: rgba(0, 255, 136, 0.15); }
  .succ-mid     .succ-badge { background: rgba(0, 229, 255, 0.1); }
  .succ-bad     .succ-badge { background: rgba(255, 71, 87, 0.1); }

  /* 7. Aurora 背景 — 已在 476 行定义强版本, 这里不再重复 (避免覆盖) */
  /* 2026-07-31: 把 .layout 从 z=1 那行拿掉，让 layout 不形成 stacking context，
     aurora (z=0) 才能透出到 layout 区域（section 半透明卡片"漂浮"在 aurora 之上） */
  .title, .subtitle, .month-switcher { position: relative; z-index: 1; }
  .layout { position: relative; }  /* z-index auto，不形成 stacking context，让 aurora 透出 */
</style>

  <div class="aurora-3rd"></div>
  <div class="title">出票自动化监控平台</div>
  <div class="subtitle" id="subtitle">从人工排查到 AI 自动分析 · 4h → 30s</div>

  <div class="layout">

      <div class="logo">🚀 出票看板 v5</div>

      <div class="nav-item" data-page="staff">👥 人员分析</div>
      <div class="nav-item" data-page="failAnalysis">🔍 失败分析</div>
      <div class="nav-item" data-page="orderAnalysis">📋 订单分析</div>
      <div class="nav-item" data-page="deadline">⏰ 产品时限</div>
      <div class="nav-section">
        <div class="nav-section-title">📊 数据</div>
        <div class="nav-mini" id="navDateRange">—</div>
        <div class="nav-mini" id="navTotalOrders">— 单</div>
        <div class="nav-mini" id="navDimCount">—</div>

        <div class="nav-section-title">💡 业务定义</div>
        <div class="nav-mini">A 全自动成功</div>

    <div class="main">
      <div class="month-switcher" id="monthSwitcher" style="display:none">
        <label>📅 年份</label>
        <select id="yearSelect"></select>
        <label>📅 月份</label>
        <select id="monthSelect"></select>
        <label>📊 周</label>
        <select id="weekSelect">
          <option value="all">全月</option>
        </select>
        <label>📆 日</label>
        <select id="daySelect">
          <option value="all">全月</option>
        </select>
        <div class="month-info" id="monthInfo"></div>
      </div>
      <div id="mainArea">
        <div class="loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">数据加载中…</div>
          <div class="loading-sub">首次访问约 3-4 秒（数据 ~1.3MB gzip）· 浏览器缓存命中后秒开</div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ============== 数据加载 ============== */
let DATA = null;          // 完整的多月数据 {available_months, current_month, months: {...}}
let CURRENT_DATA = null;  // 当前选中的数据（可能是月或日或全月）
// v10.14.7: failAnalysis 根据"选月/选日"切换数据源，存全局变量供 toggleFamilyDrill 用
let CURRENT_FAIL_FAMILIES_B = null;
let CURRENT_FAIL_FAMILIES_D = null;
let CURRENT_FAIL_REASONS_B = null;
let CURRENT_FAIL_REASONS_D = null;
let CURRENT_FAIL_VIEW = "monthly";  // "monthly" or "daily"
let CURRENT_MONTH = null; // 当前月份
let CURRENT_DAY = "all";  // 当前日（"all"=全月，"01"~"31"=具体日）
let CURRENT_WEEK = "all"; // 当前周（"all"=全月，"W1"~"W5"=自然周）
let COMPARE_DATA = null;  // 对比基准数据（上一周期）
let COMPARE_LABEL = "";   // 对比基准的标签
const chartInstances = {};

async function loadData() {
  try {
    // 优先从 window.__DASHBOARD_DATA__ 读取（Streamlit 部署用）
    // 本地直接打开时（双击 .html）回退到 fetch
    let data;
    if (typeof window.__DASHBOARD_DATA__ !== "undefined" && window.__DASHBOARD_DATA__) {
      data = window.__DASHBOARD_DATA__;
    } else {
      // 2026-07-20 新增三路径 fallback (开发模式 + 生产模式兼容):
      //   1) 相对路径 ./dashboard_data.json (本地 python -m http.server 8000 跑同目录可测, streamlit cloud 部署目录有这文件也能拉)
      //   2) jsDelivr CDN (兜底, 万一 1) 404 或部署目录没文件)
      //   用最新 commit hash 作 URL 段, 绕过 jsDelivr CDN 缓存 (commit 变 → URL 变 → jsDelivr 当新 URL 返回)
      //   浏览器缓存: 同一 URL 二次访问秒开
      //   实测: 1.3MB gzip 走 jsDelivr 约 3-4s, raw 15MB 不带 gzip 头 100s+
const COMMIT = "199fe36";
      const DATA_URL_JS = `https://cdn.jsdelivr.net/gh/yikedashua-create/auto-ticket-dashboard@${COMMIT}/dashboard_data.json`;
      let dataLoaded = false;
      // 路径 1: 相对路径
      try {
        const r = await fetch("./dashboard_data.json");
        if (r.ok) {
          data = await r.json();
          dataLoaded = true;
          console.log("[loadData] 本地相对路径 OK");
        }
      } catch (e) { /* ignore, fallback */ }
      // 路径 2: jsDelivr CDN
      if (!dataLoaded) {
        console.log("[loadData] fallback 到 jsDelivr");
        const resp = await fetch(DATA_URL_JS);
        data = await resp.json();
      }
    }
    DATA = data;

    // 兼容旧版：如果 JSON 没有 months 字段，包装一下
    if (!DATA.months) {
      DATA.months = { "all": DATA };
      DATA.available_months = ["all"];
      DATA.current_month = "all";
    }

    // 初始化月份切换器
    initMonthSwitcher();
    switchPeriod(DATA.current_month, "all");
  } catch (e) {
    document.getElementById("mainArea").innerHTML =
      '<div class="loading" style="color:#ff4757">❌ 数据加载失败：' + e.message +
      '<br><br>请用 Python 起本地服务：<br><code style="color:#00e5ff">python -m http.server 8000</code><br>然后浏览器打开 http://localhost:8000/dashboard_v5.html</div>';
  }
}

function initMonthSwitcher() {
  const yearSel = document.getElementById("yearSelect");
  const monthSel = document.getElementById("monthSelect");
  const sw = document.getElementById("monthSwitcher");
  sw.style.display = "flex";

  // 1. 年份下拉: 从 available_months 提取所有年份 (降序)
  const yearSet = [...new Set(
    DATA.available_months.filter(m => m !== "all").map(m => m.substring(0, 4))
  )].sort().reverse();
  yearSel.innerHTML = '<option value="all">全部</option>' +
    yearSet.map(y => `<option value="${y}">${y}</option>`).join("");

  // 2. 月份下拉: 按选中年份过滤
  function fillMonths(year) {
    const months = year === "all"
      ? DATA.available_months
      : DATA.available_months.filter(m => m === "all" || m.startsWith(year));
    monthSel.innerHTML = months.map(m => {
      const label = m === "all" ? "全部" : m.substring(5);
      return `<option value="${m}">${label}</option>`;
    }).join("");
    // 默认选 current_month, 如果不在过滤结果里就选第一个
    if (months.includes(DATA.current_month)) {
      monthSel.value = DATA.current_month;
    } else {
      monthSel.value = months[0] || "all";
    }
  }

  // 默认选 current_month 所在年份
  const currentYear = DATA.current_month !== "all"
    ? DATA.current_month.substring(0, 4)
    : (yearSet[0] || "all");
  yearSel.value = currentYear;
  fillMonths(currentYear);

  // 3. 联动: 选年 → 重置月/周/日
  yearSel.addEventListener("change", e => {
    fillMonths(e.target.value);
    CURRENT_WEEK = "all";
    updateWeekOptions(monthSel.value);
    updateDayOptions(monthSel.value, "all");
    switchPeriod(monthSel.value, "all", "all");
  });

  monthSel.addEventListener("change", e => {
    CURRENT_WEEK = "all";
    updateWeekOptions(e.target.value);
    updateDayOptions(e.target.value, "all");
    switchPeriod(e.target.value, "all", "all");
  });
  document.getElementById("weekSelect").addEventListener("change", e => {
    CURRENT_DAY = "all";
    updateDayOptions(CURRENT_MONTH, e.target.value);
    switchPeriod(CURRENT_MONTH, "all", e.target.value);
  });
  document.getElementById("daySelect").addEventListener("change", e => {
    CURRENT_WEEK = "all";
    switchPeriod(CURRENT_MONTH, e.target.value, "all");
  });
  updateWeekOptions(DATA.current_month);
  updateDayOptions(DATA.current_month, "all");
}

function updateWeekOptions(month) {
  const weekSel = document.getElementById("weekSelect");
  let weeks = [];
  if (month === "all") {
    Object.values(DATA.months).forEach(m => {
      if (m.summary && m.summary.natural_weekly) {
        m.summary.natural_weekly.forEach(w => weeks.push({ ...w, _month: m.month }));
      }
    });
  } else {
    const m = DATA.months[month];
    if (m && m.summary && m.summary.natural_weekly) {
      weeks = m.summary.natural_weekly;
    }
  }
  // 月+周用 _month 区分
  const opts = ['<option value="all">全月</option>'];
  const seen = new Set();
  weeks.forEach(w => {
    const key = w._month ? `${w._month}-${w.week}` : `${month || "all"}-${w.week}`;
    if (seen.has(key)) return;
    seen.add(key);
    const monthLabel = w._month || month || "all";
    // 简化 label: W1 (07-01~07-05)  (省略月份前缀, 月份在 monthSelect 里)
    opts.push(`<option value="${monthLabel}|${w.week}">${w.week}（${w.date_range}）</option>`);
  });
  weekSel.innerHTML = opts.join("");
  weekSel.value = "all";
}

function updateDayOptions(month, week) {
  const daySel = document.getElementById("daySelect");
  let dates = [];
  // date -> total 映射, 用于显示每日单数
  const dayTotals = {};
  // 2026-07-18 改造：周选中时，只列该周内日期
  if (week && week !== "all" && month !== "all") {
    // week = "2026-07|W1" 格式
    const [mKey, wKey] = week.split("|");
    const m = DATA.months[mKey];
    if (m && m.summary && m.summary.natural_weekly) {
      const w = m.summary.natural_weekly.find(x => x.week === wKey);
      if (w) {
        dates = w.days;
        // 从 daily 拿每日单数
        if (m.daily) {
          m.daily.forEach(d => {
            if (dates.includes(d.date)) dayTotals[d.date] = d.total || 0;
          });
        }
      }
    }
  } else if (month === "all") {
    Object.values(DATA.months).forEach(m => {
      if (m.daily) m.daily.forEach(d => {
        if (!dates.includes(d.date)) dates.push(d.date);
        dayTotals[d.date] = d.total || 0;
      });
    });
    dates = [...new Set(dates)].sort();
  } else {
    const m = DATA.months[month];
    if (m && m.daily) {
      dates = m.daily.map(d => d.date);
      m.daily.forEach(d => { dayTotals[d.date] = d.total || 0; });
    }
  }
  const isWeek = week && week !== "all";
  const allLabel = isWeek ? '全周' : '全月';
  daySel.innerHTML = `<option value="all">${allLabel}</option>` + dates.map(d => {
    const day = d.substring(8, 10);
    return `<option value="${day}">${day}</option>`;
  }).join("");
  daySel.value = "all";
}

/* 计算"上一周期"：用于对比 */
function getComparePeriod(month, day, week) {
  if (day !== "all") {
    // 选某日：对比前一日（跨月就跨月）
    const dt = new Date(month + "-" + day);
    dt.setDate(dt.getDate() - 1);
    const prev = dt.toISOString().substring(0, 10);
    const prevMonth = prev.substring(0, 7);
    return { type: "day", month: prevMonth, day: prev.substring(8, 10), label: prev };
  } else if (week && week !== "all") {
    // 选周：对比上一周（同月 W(N-1)，或上月最后一周）
    // week = "2026-07|W1" 格式
    const [mKey, wKey] = week.split("|");
    const wNum = parseInt(wKey.substring(1));
    const m = DATA.months[mKey];
    if (!m || !m.summary || !m.summary.natural_weekly) return null;
    if (wNum > 1) {
      // 同月上一周
      const prev = m.summary.natural_weekly.find(x => x.week === `W${wNum - 1}`);
      if (prev) return { type: "week", week: `${mKey}|${prev.week}`, label: `${mKey} ${prev.week}（${prev.date_range}）` };
      return null;
    } else {
      // W1 → 上月最后一周
      const months = DATA.available_months.filter(x => x !== "all").sort();
      const idx = months.indexOf(mKey);
      if (idx <= 0) return null;
      const prevMonth = months[idx - 1];
      const pm = DATA.months[prevMonth];
      if (!pm || !pm.summary || !pm.summary.natural_weekly) return null;
      const weeks = pm.summary.natural_weekly;
      const last = weeks[weeks.length - 1];
      return { type: "week", week: `${prevMonth}|${last.week}`, label: `${prevMonth} ${last.week}（${last.date_range}）` };
    }
  } else {
    // 选全月：对比上月（找 available_months 里前一月）
    if (month === "all") {
      // 全月对比：选"上一个月份的全月"
      const months = DATA.available_months.filter(m => m !== "all").sort();
      if (months.length < 2) return null;
      const lastMonth = months[months.length - 2];
      return { type: "month", month: lastMonth, day: "all", label: lastMonth + " 全月" };
    } else {
      const idx = DATA.available_months.indexOf(month);
      if (idx <= 0) return null;
      const prevMonth = DATA.available_months[idx - 1];
      return { type: "month", month: prevMonth, day: "all", label: prevMonth + " 全月" };
    }
  }
}

/* 计算某月某日的数据（从 daily 字段取） */
function getDayData(month, day) {
  const m = DATA.months[month];
  if (!m) return null;
  const target = month + "-" + day;
  // 优先用 daily_detail（按日完整聚合数据，包含 fail_reasons / stage 等）
  if (m.daily_detail && m.daily_detail[target]) {
    const detail = m.daily_detail[target];
    return { ...detail, _period_type: "day", _period_date: target };
  }
  // 降级：只用 daily 单行（无详细数据）
  if (!m.daily) return null;
  const d = m.daily.find(x => x.date === target);
  if (!d) return null;
  return aggregateDayToMonthShape(m, d);
}

/* 计算某月某周的数据（按日聚合 + 合并 daily_detail）
   weekKey 格式: "2026-07|W1" */
function getWeekData(weekKey) {
  const [mKey, wKey] = weekKey.split("|");
  const m = DATA.months[mKey];
  if (!m || !m.summary || !m.summary.natural_weekly) return null;
  const weekInfo = m.summary.natural_weekly.find(w => w.week === wKey);
  if (!weekInfo) return null;
  const days = weekInfo.days;
  const dailyRows = (m.daily || []).filter(d => days.includes(d.date));
  if (dailyRows.length === 0) return null;

  // 聚合 summary
  const total = dailyRows.reduce((s, r) => s + r.total, 0);
  const A = dailyRows.reduce((s, r) => s + r.A, 0);
  const B = dailyRows.reduce((s, r) => s + r.B, 0);
  const C = dailyRows.reduce((s, r) => s + r.C, 0);
  const D = dailyRows.reduce((s, r) => s + r.D, 0);
  const profit_sum = dailyRows.reduce((s, r) => s + r.profit_sum, 0);
  const profit_pos = dailyRows.reduce((s, r) => s + r.profit_pos, 0);
  const auto = A + B;

  // 合并 daily_detail（用于下钻）
  const daily_detail = {};
  days.forEach(d => {
    if (m.daily_detail && m.daily_detail[d]) daily_detail[d] = m.daily_detail[d];
  });

  return {
    ...m,
    summary: {
      month: `${mKey} ${wKey}`,
      total_days: days.length,
      total_orders: total,
      A, B, C, D,
      A_ratio: total ? A / total * 100 : 0,
      B_ratio: total ? B / total * 100 : 0,
      C_ratio: total ? C / total * 100 : 0,
      D_ratio: total ? D / total * 100 : 0,
      auto_coverage_rate: total ? auto / total * 100 : 0,
      auto_succ_rate: auto ? A / auto * 100 : 0,
      B_to_manual_rate: total ? B / total * 100 : 0,
      total_profit: profit_sum,
      avg_profit: total ? profit_sum / total : 0,
      profit_pos,
      profit_pos_rate: total ? profit_pos / total * 100 : 0,
      natural_weekly: [weekInfo],  // 保留周数据供 renderWeekly 用
    },
    daily: dailyRows,
    daily_detail,
    _period_type: "week",
    _period_date: weekInfo.date_range,
  };
}

/* 把 daily 单行包装成 month-data 同等结构（降级方案） */
function aggregateDayToMonthShape(monthData, dayRow) {
  return {
    ...monthData,
    summary: {
      month: dayRow.date,
      total_days: 1,
      total_orders: dayRow.total,
      A: dayRow.A, B: dayRow.B, C: dayRow.C, D: dayRow.D,
      A_ratio: dayRow.total ? dayRow.A / dayRow.total * 100 : 0,
      B_ratio: dayRow.total ? dayRow.B / dayRow.total * 100 : 0,
      C_ratio: dayRow.total ? dayRow.C / dayRow.total * 100 : 0,
      D_ratio: dayRow.total ? dayRow.D / dayRow.total * 100 : 0,
      auto_coverage_rate: dayRow.auto_coverage_rate,
      auto_succ_rate: dayRow.auto_succ_rate,
      B_to_manual_rate: dayRow.B_ratio,
      total_profit: dayRow.profit_sum,
      avg_profit: dayRow.avg_profit,
      profit_pos: dayRow.profit_pos,
      profit_pos_rate: dayRow.profit_pos_rate,
    },
    daily: [dayRow],
    _period_type: "day",
    _period_date: dayRow.date,
  };
}

function switchPeriod(month, day, week) {
  Object.keys(chartInstances).forEach(k => destroyChart(k));

  CURRENT_MONTH = month;
  CURRENT_DAY = day;
  CURRENT_WEEK = week || "all";

  // 算对比基准
  const comparePeriod = getComparePeriod(month, day, week);
  if (comparePeriod) {
    if (comparePeriod.type === "day") {
      COMPARE_DATA = getDayData(comparePeriod.month, comparePeriod.day);
    } else if (comparePeriod.type === "week") {
      COMPARE_DATA = getWeekData(comparePeriod.week);
    } else {
      COMPARE_DATA = DATA.months[comparePeriod.month] || null;
    }
    COMPARE_LABEL = comparePeriod.label;
  } else {
    COMPARE_DATA = null;
    COMPARE_LABEL = "无上一周期数据";
  }

  // 算当前数据
  if (day !== "all") {
    CURRENT_DATA = getDayData(month, day);
  } else if (week && week !== "all") {
    // 选周：week 格式 "2026-07|W1"
    CURRENT_DATA = getWeekData(week);
  } else {
    CURRENT_DATA = DATA.months[month];
  }

  if (!CURRENT_DATA) {
    document.getElementById("mainArea").innerHTML = `
      <div class="empty-state">
        <h2>📭 ${month} ${day !== "all" ? day + " 日" : (week && week !== "all" ? week : "")} 没有数据</h2>
        <p>把对应日期的 xlsx 放到桌面「出票总订单数据」目录，然后跑：</p>
        <code>python gen_dashboard_data.py</code>
        <p style="margin-top: 20px; color:#5a6b80">可用月份：${DATA.available_months.join("、") || "无"}</p>
      </div>`;
    document.getElementById("monthInfo").textContent = "0 单 / 0 天";
    return;
  }

  const s = CURRENT_DATA.summary;
  const periodLabel = day !== "all" ? `${month} ${day} 日`
    : (week && week !== "all" ? `${month} ${week.split("|")[1]}（${CURRENT_DATA._period_date}）`
    : (month === "all" ? "全部月份" : month));
  document.getElementById("monthInfo").innerHTML =
    `<b>${s.total_orders.toLocaleString()}</b> 单 · <b>${s.total_days}</b> 天` +
    (COMPARE_DATA ? ` <span style="color:#7a8ba0;font-size:11px">· 对比 ${COMPARE_LABEL}</span>` : "");

  document.getElementById("subtitle").textContent =
    `从人工排查到 AI 自动分析 · 4h → 30s`;

  // 侧边栏概览
  if (CURRENT_DATA.daily && CURRENT_DATA.daily.length > 0) {
    const d0 = CURRENT_DATA.daily[0].date;
    const d1 = CURRENT_DATA.daily[CURRENT_DATA.daily.length - 1].date;
    const fmt = d => d.substring(5, 7) + "月" + d.substring(8, 10) + "日";
    document.getElementById("navDateRange").textContent = day !== "all" ? `${month} ${day} 日` : `${fmt(d0)} ~ ${fmt(d1)}`;
  }
  document.getElementById("navTotalOrders").textContent = `${s.total_orders.toLocaleString()} 单`;
  document.getElementById("navDimCount").textContent =
    `${CURRENT_DATA.airline.length} 航司 / ${CURRENT_DATA.platform.length} 平台 / ${CURRENT_DATA.channel.length} 渠道`;

  renderAll();
}

/* ============== 工具函数 ============== */
const fmt = {
  num: n => n.toLocaleString("zh-CN"),
  pct: n => n.toFixed(1) + "%",
  money: n => (n >= 0 ? "+" : "") + n.toLocaleString("zh-CN", { maximumFractionDigits: 0 }),
  avg: n => (n >= 0 ? "+¥" : "-¥") + Math.abs(n).toFixed(2),
  date: s => s.substring(5),  // "2026-05-01" -> "05-01"
  // D30：各平台表格 cell 涨/降/百分比 显示
  // cur = 当前值, prev = 前一日值
  // 返回 HTML：<b>当前值</b><br><span class="delta-pos/neg/zero">▲/▼/─ ±差值 (±%)</span>
  cellDelta: (cur, prev) => {
    cur = Number(cur) || 0;
    prev = Number(prev) || 0;
    if (cur === 0 && prev === 0) {
      return `<div class="delta-cell"><b>0</b> <span class="delta-zero">—</span></div>`;
    }
    if (prev === 0) {
      // 昨天没单（新增/新平台/昨日无数据）
      return `<div class="delta-cell"><b>${fmt.num(cur)}</b> <span class="delta-pos">▲ +${fmt.num(cur)} (新增)</span></div>`;
    }
    const diff = cur - prev;
    const pct = (diff / prev) * 100;
    const arrow = diff > 0 ? "▲" : (diff < 0 ? "▼" : "─");
    const sign = diff > 0 ? "+" : (diff < 0 ? "" : "");
    const signPct = pct > 0 ? "+" : (pct < 0 ? "" : "");
    const cls = diff > 0 ? "delta-pos" : (diff < 0 ? "delta-neg" : "delta-zero");
    return `<div class="delta-cell"><b>${fmt.num(cur)}</b> <span class="${cls}">${arrow}${sign}${fmt.num(diff)} (${signPct}${pct.toFixed(1)}%)</span></div>`;
  },
  // 对比徽章：返回 HTML 字符串
  // cur: 当前值  base: 上期值（用于算 diff 和 %）
  // mode: "rate"（值越高越好，比如覆盖率）、"amount"（值越低越好，比如亏损单）
  //        → 影响颜色方向
  // isPct: 基准是否按百分数显示（true → "96.6%"，false → "8,591"）
  // isMoney: 基准是否按金额显示（true → "¥96,000"）
  cmp: (cur, base, mode, isPct, isMoney = false) => {
    if (base === null || base === undefined || isNaN(base) || base === 0) {
      return `<span class="cmp-no">vs 上期: 无数据</span>`;
    }
    const diff = cur - base;
    const pctChange = (diff / Math.abs(base)) * 100;
    const arrow = diff > 0 ? "▲" : (diff < 0 ? "▼" : "·");
    let color = "#7a8ba0";
    if (diff !== 0) {
      if (mode === "rate") color = diff > 0 ? "#00ff88" : "#ff4757";   // 涨绿跌红
      else if (mode === "amount") color = diff < 0 ? "#00ff88" : "#ff4757"; // 跌绿涨红
    }
    // 格式化基准值（显示上期实际数值）
    let baseStr;
    if (isPct) {
      baseStr = `${base.toFixed(1)}%`;
    } else if (isMoney) {
      const sign = base >= 0 ? "+" : "-";
      baseStr = `¥${sign}${Math.abs(Math.round(base)).toLocaleString("zh-CN")}`;
    } else {
      baseStr = fmt.num(Math.round(base));
    }
    const signPct = pctChange > 0 ? "+" : (pctChange < 0 ? "" : "");
    return `<span class="cmp-badge" style="color:${color}">${arrow} ${baseStr} (${signPct}${pctChange.toFixed(1)}%)</span>`;
  }
};

const color = {
  A: "#00ff88",   // 全自动成功 - 绿
  B: "#ffa502",   // 转人工 - 黄
  C: "#7a8ba0",   // 纯人工 - 灰
  D: "#ff4757",   // 异常 - 红
  cyan: "#00e5ff",
};

function destroyChart(id) {
  if (chartInstances[id]) {
    chartInstances[id].dispose();
    delete chartInstances[id];
  }
}

function createChart(id, option) {
  destroyChart(id);
  const dom = document.getElementById(id);
  if (!dom) return;
  const c = echarts.init(dom, "dark", { renderer: "canvas" });
  c.setOption(option);
  chartInstances[id] = c;
}

/* ============== 页面：总览 ============== */
function renderOverview() {
  const s = CURRENT_DATA.summary;
  const monthLabel = CURRENT_MONTH === "all" ? "全月"
    : (CURRENT_WEEK !== "all" ? `${CURRENT_MONTH} ${CURRENT_WEEK.split("|")[1] || CURRENT_WEEK}`
    : (CURRENT_DAY !== "all" ? `${CURRENT_MONTH} ${CURRENT_DAY} 日` : CURRENT_MONTH));
  const cs = COMPARE_DATA ? COMPARE_DATA.summary : null;  // 对比基准 summary
  const cmpBadge = (cur, base, mode, isPct, isMoney = false) => cs ? fmt.cmp(cur, base, mode, isPct, isMoney) : `<span class="cmp-no">无对比基准</span>`;
  // 2026-07-20 新增: KPI 卡片颜色按对比变化动态切换
  const trendCls = (cur, base) => {
    if (!cs) return "";
    if (cur == null || base == null) return "";
    if (cur > base) return "up";
    if (cur < base) return "down";
    return "flat";
  };
  const kpiCls = (cur, base, type) => {
    const t = trendCls(cur, base);
    return t ? `${t}-${type}` : "";
  };

  // 2026-07-30 新增: 自动化成功率排行 (航司/渠道, 目标 83%, 3 档状态徽章)
  //   - 筛选 auto_succ_rate > 0 (排除数据缺失项) → 降序 (最优秀排前面) → 全量
  //   - 3 档阈值: ≥83% 达标 / ≥50% 中等 / <50% 待改
  //   - 行式: [名称] [进度条（含 83% 目标线 + 目标标签）] [auto_succ_rate%] [状态徽章]
  //   - 进度条滚动渐入: IntersectionObserver 触发 width 0→data-target%
  const SUCC_TARGET = 83;  // 目标值
  const succRowHtml = (r, type) => {
    const rate = r.auto_succ_rate || 0;
    let level, badgeText, color, glow;
    if (rate >= SUCC_TARGET) { level = 'perfect'; badgeText = '达标'; color = '#00ff88'; glow = 'rgba(0,255,136,0.4)'; }
    else if (rate >= 50)     { level = 'mid';     badgeText = '中等'; color = '#00e5ff'; glow = 'rgba(0,229,255,0.3)'; }
    else                     { level = 'bad';     badgeText = '待改'; color = '#ff4757'; glow = 'rgba(255,71,87,0.3)'; }
    const name = type === 'airline' ? r.airline : r.channel;
    const diff = (SUCC_TARGET - rate).toFixed(2);
    const diffStr = rate >= SUCC_TARGET ? `+${(rate - SUCC_TARGET).toFixed(2)}` : `差 ${diff}`;
    return `
      <div class="succ-row succ-${level}">
        <span class="succ-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>

          <div class="succ-target-line" style="left:${SUCC_TARGET}%"></div>

        <span class="succ-badge" style="border-color:${color};color:${color}">${badgeText} · ${diffStr}</span>

  const succAirlines = (CURRENT_DATA.airline || [])
    .filter(a => (a.auto_succ_rate || 0) > 0)
    .sort((a, b) => b.auto_succ_rate - a.auto_succ_rate);
  const succChannels = (CURRENT_DATA.channel || [])
    .filter(c => (c.auto_succ_rate || 0) > 0)
    .sort((a, b) => b.auto_succ_rate - a.auto_succ_rate);

  // 2026-07-30 回滚: 还原 7-KPI 横排 + 4 路径饼图 原始结构
  // 之前 c58e06e 误改成 marketing-style hero, 太花且改了用户原本的布局, 已退回
  const html = `
    <div class="section">
      <div class="section-title"><span class="anim-hero-mask">💎 核心 KPI</span> · ${monthLabel}
        <span class="badge badge-info">${s.total_days} 天 · ${fmt.num(s.total_orders)} 单</span>
        ${cs ? `<span class="badge badge-info" style="background:#1e3a5f">对比 ${COMPARE_LABEL}</span>` : ""}
      </div>
      <div class="kpi-row cols-7">
        <div class="kpi ${kpiCls(s.total_orders, cs && cs.total_orders, 'good')}">
          <div class="kpi-label">📦 订单总数</div>
          <div class="kpi-value" data-count="${s.total_orders}">${fmt.num(s.total_orders)}</div>
          <div class="kpi-sub">${s.total_days} 天总单</div>
          <div class="kpi-sub-row">${cs ? cmpBadge(s.total_orders, cs.total_orders, "rate", false) : ""}</div>
        </div>
        <div class="kpi ${kpiCls(s.total_segments, cs && cs.total_segments, 'good')}">
          <div class="kpi-label">✈️ 航段总数</div>
          <div class="kpi-value" data-count="${s.total_segments}">${fmt.num(s.total_segments)}</div>
          <div class="kpi-sub">一票 = 1 段 · 往返 = 2 段</div>
          <div class="kpi-sub-row">${cs ? cmpBadge(s.total_segments, cs.total_segments, "rate", false) : ""}</div>
        </div>
        <div class="kpi ${kpiCls(s.A, cs && cs.A, 'good')}">
          <div class="kpi-label">✅ 全自动成功</div>
          <div class="kpi-value" data-count="${s.A}">${fmt.num(s.A)}</div>
          <div class="kpi-sub">A 路径 · 占比 ${fmt.pct(s.A / s.total_orders * 100)}</div>
          <div class="kpi-sub-row">${cs ? cmpBadge(s.A, cs.A, "rate", false) : ""}</div>
        </div>
        <div class="kpi ${kpiCls(s.B, cs && cs.B, 'bad')}">
          <div class="kpi-label">❌ 全自动失败</div>
          <div class="kpi-value" data-count="${s.B}">${fmt.num(s.B)}</div>
          <div class="kpi-sub">B 路径 · 占比 ${fmt.pct(s.B / s.total_orders * 100)}</div>
          <div class="kpi-sub-row">${cs ? cmpBadge(s.B, cs.B, "amount", false) : ""}</div>
        </div>
        <div class="kpi ${kpiCls(s.C, cs && cs.C, 'bad')}">
          <div class="kpi-label">🛒 订单转人工</div>
          <div class="kpi-value" data-count="${s.C}">${fmt.num(s.C)}</div>
          <div class="kpi-sub">C 路径 · 占比 ${fmt.pct(s.C / s.total_orders * 100)}</div>
          <div class="kpi-sub-row">${cs ? cmpBadge(s.C, cs.C, "amount", false) : ""}</div>
        </div>
        <div class="kpi ${kpiCls(s.auto_coverage_rate, cs && cs.auto_coverage_rate, 'good')}">
          <div class="kpi-label">📈 全自动覆盖率</div>
          <div class="kpi-value" data-count="${s.auto_coverage_rate}" data-count-dec="2" data-count-suf="%">${fmt.pct(s.auto_coverage_rate)}</div>
          <div class="kpi-sub">A+B 占比 · ${fmt.num(s.A+s.B)} 单</div>
          <div class="kpi-sub-row">${cs ? cmpBadge(s.auto_coverage_rate, cs.auto_coverage_rate, "rate", true) : ""}</div>
        </div>
        <div class="kpi ${kpiCls(s.auto_succ_rate, cs && cs.auto_succ_rate, 'good')}">
          <div class="kpi-label">🎯 全自动成功率</div>
          <div class="kpi-value" data-count="${s.auto_succ_rate}" data-count-dec="2" data-count-suf="%">${fmt.pct(s.auto_succ_rate)}</div>
          <div class="kpi-sub">A / (A+B)</div>
          <div class="kpi-sub-row">${cs ? cmpBadge(s.auto_succ_rate, cs.auto_succ_rate, "rate", true) : ""}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🔍 路径分布 · 4 路径
        <span class="badge badge-info">${fmt.num(s.total_orders)} 单全量</span>
      </div>
      <div class="chart-box" style="display:flex;justify-content:center;align-items:center;min-height:380px">
        <div id="chart-pathPie" class="chart-area" style="width:100%;max-width:520px;height:380px"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">✈️ 航司自动化成功率（目标 ${SUCC_TARGET}%）
        <span class="badge badge-info">全量 ${succAirlines.length} 航司（优→差）</span>
        <span class="badge badge-info" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)">▎ 目标线 ${SUCC_TARGET}% · 达标 ≥${SUCC_TARGET}% · 中等 ≥50% · 待改 &lt;50%</span>
      </div>
      <div class="succ-list">${succAirlines.map(a => succRowHtml(a, 'airline')).join("")}</div>
    </div>

    <div class="section">
      <div class="section-title">🛒 渠道自动化成功率（目标 ${SUCC_TARGET}%）
        <span class="badge badge-info">全量 ${succChannels.length} 渠道（优→差）</span>
        <span class="badge badge-info" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)">▎ 目标线 ${SUCC_TARGET}% · 达标 ≥${SUCC_TARGET}% · 中等 ≥50% · 待改 &lt;50%</span>
      </div>
      <div class="succ-list">${succChannels.map(c => succRowHtml(c, 'channel')).join("")}</div>
    </div>

  `;
  document.getElementById("mainArea").innerHTML = html;

  // 2026-07-30 新增: 自动化成功率进度条滚动渐入 (IntersectionObserver)
  //   - 初次渲染 width: 0 (CSS)
  //   - 进入视口时, 把 .succ-fill 的 width 设为 data-target% (1.2s ease-out)
  //   - 一次性触发, unobserve 避免重复
  if (typeof IntersectionObserver !== 'undefined') {
    const succBarObs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const fill = e.target.querySelector('.succ-fill');
          if (fill) fill.style.width = fill.dataset.target + '%';
          succBarObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.2 });
    document.querySelectorAll('.succ-row').forEach(r => succBarObs.observe(r));
  } else {
    // 降级: 浏览器不支持 IO, 直接显示最终宽度
    document.querySelectorAll('.succ-fill').forEach(f => { f.style.width = f.dataset.target + '%'; });
  }

  // 4 路径饼图（含对比 tooltip + 中心总数）
  const cs2 = COMPARE_DATA ? COMPARE_DATA.summary : null;
  const pieData = [
    { name: "A 全自动成功", value: s.A, itemStyle: { color: color.A } },
    { name: "B 全自动失败", value: s.B, itemStyle: { color: color.B } },
    { name: "C 订单转人工", value: s.C, itemStyle: { color: color.C } },
    { name: "D 订单处理中", value: s.D, itemStyle: { color: color.D } },
  ];
  const tooltipFmt = (p) => {
    if (!cs2) return "{b}<br>{c} 单 ({d}%)";
    const prev = { "A 全自动成功": cs2.A, "B 全自动失败": cs2.B, "C 订单转人工": cs2.C, "D 订单处理中": cs2.D }[p.name] ?? 0;
    const diff = p.value - prev;
    const sign = diff > 0 ? "+" : (diff < 0 ? "" : "·");
    return "{b}<br>当前: {c} 单 ({d}%)<br>对比: " + prev + " 单<br>差: " + sign + diff + " 单";
  };
  createChart("chart-pathPie", {
    ...baseEchartsOpt,
    tooltip: { ...baseEchartsOpt.tooltip, trigger: "item", formatter: tooltipFmt },
    // 中心总数 graphic + 居中饼图
    graphic: [
      { type: 'text', left: 'center', top: '44%', style: { text: fmt.num(s.total_orders), fill: '#ffffff', fontSize: 36, fontWeight: 800, fontFamily: "'Segoe UI', 'PingFang SC', sans-serif", textAlign: 'center', textShadow: '0 0 16px rgba(0, 229, 255, 0.4)' } },
      { type: 'text', left: 'center', top: '58%', style: { text: '总订单数', fill: 'rgba(148, 163, 184, 0.85)', fontSize: 12, fontFamily: "'Segoe UI', 'PingFang SC', sans-serif", textAlign: 'center', letterSpacing: 1 } },
    ],
    series: [{
      type: "pie",
      radius: ["50%", "75%"],
      center: ["50%", "55%"],
      label: { color: "rgba(224, 230, 240, 0.92)", formatter: "{b}\n{d}%", fontSize: 12, fontFamily: "'Segoe UI', 'PingFang SC', sans-serif", textShadowColor: "rgba(0, 0, 0, 0.6)", textShadowBlur: 4 },
      labelLine: { length: 12, length2: 10, lineStyle: { color: "rgba(0, 229, 255, 0.4)" } },
      data: pieData,
    }],
  });
}

/* ============== 页面：今日时段（2026-07-18 新增）============== */
function renderHourly() {
  // 2026-07-20 重构：按 period 选 hourly 数据源
  //   选 day：daily_detail[date].summary.hourly_today
  //   选 week：聚合 W 内 daily 的 hourly
  //   选 month：month.summary.hourly_today（该月最后一天）
  //   选 all month：聚合所有月最后一天 hourly
  //   25 个 hour bucket (0-24)，24:00 = hour 0 的数据（端点）

  // 计算 period label + hourly 数据源
  let hourlyArr = null;  // 24 hour × 聚合 source
  let dateLabel = "";
  const m = (CURRENT_MONTH && CURRENT_MONTH !== "all") ? DATA.months[CURRENT_MONTH] : null;

  if (CURRENT_DAY && CURRENT_DAY !== "all" && m) {
    // 选某日：取该日 hourly_today
    const dateKey = `${m.month}-${String(CURRENT_DAY).padStart(2, "0")}`;
    const day = m.daily_detail && m.daily_detail[dateKey];
    if (day && day.summary && day.summary.hourly_today) {
      hourlyArr = [day.summary.hourly_today.data];
      dateLabel = dateKey;
    }
  } else if (CURRENT_WEEK && CURRENT_WEEK !== "all" && m) {
    // 选周：聚合 W 内所有日 hourly
    const [mKey, wKey] = CURRENT_WEEK.split("|");
    const mData = DATA.months[mKey];
    const weekInfo = mData && mData.summary && mData.summary.natural_weekly
      ? mData.summary.natural_weekly.find(w => w.week === wKey)
      : null;
    if (weekInfo && mData.daily_detail) {
      hourlyArr = weekInfo.days
        .map(d => mData.daily_detail[d] && mData.daily_detail[d].summary && mData.daily_detail[d].summary.hourly_today
          ? mData.daily_detail[d].summary.hourly_today.data
          : null)
        .filter(x => x);
      dateLabel = `${mKey} ${wKey}（${weekInfo.date_range}）`;
    }
  } else if (CURRENT_MONTH && CURRENT_MONTH !== "all" && m) {
    // 选某月：该月 hourly_today（最后一天）
    if (m.summary && m.summary.hourly_today) {
      hourlyArr = [m.summary.hourly_today.data];
      dateLabel = m.summary.hourly_today.date;
    }
  } else {
    // 选 all month：聚合所有月最后一天 hourly
    const all = Object.values(DATA.months || {})
      .map(mm => mm.summary && mm.summary.hourly_today)
      .filter(x => x);
    if (all.length) {
      hourlyArr = all.map(x => x.data);
      dateLabel = "全部月份（聚合）";
    }
  }

  if (!hourlyArr || !hourlyArr.length) {
    document.getElementById("mainArea").innerHTML = `
      <div class="section">
        <div class="section-title">🕐 时段分析（0-24 点 · 1 小时单位）</div>
        <div style="padding:40px;text-align:center;color:#7a8ba0">
          ⚠️ 暂无 hourly 数据
        </div>
      </div>`;
    return;
  }

  // 聚合多源（如 week 聚合 N 天）：按 hour 加和
  const aggregated = Array.from({ length: 24 }, (_, h) => {
    let total = 0, A = 0, B = 0, C = 0, D = 0;
    for (const arr of hourlyArr) {
      const row = arr.find(r => r.hour === h);
      if (row) {
        total += row.total; A += row.A; B += row.B; C += row.C; D += row.D;
      }
    }
    const auto = A + B;
    return {
      hour: h, total, A, B, C, D,
      auto_coverage_rate: total ? (auto / total * 100) : 0,
      auto_succ_rate: auto ? (A / auto * 100) : 0,
    };
  });

  // 2026-07-20 改法 A: 区间"右端点"命名
  //   X 标签 = "区间 [X-1, X]" 的右端点 X
  //   0:00 = 跨天 hour 23 (前 23:00-00:00, dashboard 切"今天"看不到 = 0)
  //   1:00 = hour 0 (00:00-01:00)
  //   2:00 = hour 1 (01:00-02:00)
  //   ...
  //   24:00 = hour 23 (23:00-24:00)
  //   优点: 23 和 24 数据不同 (hour 22 vs hour 23), 折线"自然"上升
  //   缺点: 0:00 跨天是"特殊点" (dashboard 切今天时 = 0)
  const fullData = [];
  for (let x = 0; x <= 24; x++) {
    let r;
    if (x === 0) {
      // 跨天 hour 23: 当前实现拿不到前一天数据, 用 0 占位
      r = { total: 0, A: 0, B: 0, C: 0, D: 0,
            auto_coverage_rate: 0, auto_succ_rate: 0 };
    } else {
      r = aggregated[x - 1];
    }
    fullData.push({
      hour: x, total: r.total, A: r.A, B: r.B, C: r.C, D: r.D,
      auto_coverage_rate: r.auto_coverage_rate,
      auto_succ_rate: r.auto_succ_rate,
    });
  }

  const total = fullData.reduce((s, r) => s + r.total, 0);
  const totalA = fullData.reduce((s, r) => s + r.A, 0);
  const totalB = fullData.reduce((s, r) => s + r.B, 0);
  const totalC = fullData.reduce((s, r) => s + r.C, 0);
  const totalD = fullData.reduce((s, r) => s + r.D, 0);

  // 表格行（25 行，0-24；改法 A: 0:00 = 跨天 hour 23 显示成 "00:00(跨天)"，24:00 显示成 "24:00"）
  const tableRows = fullData.map(r => {
    const auto = r.A + r.B;
    const succ = auto > 0 ? (r.A / auto * 100).toFixed(1) : "—";
    let label;
    if (r.hour === 0) {
      label = "00:00<br><span style='font-size:10px;color:#7a8ba0'>(跨天)</span>";
    } else if (r.hour === 24) {
      label = "24:00";
    } else {
      label = `${String(r.hour).padStart(2, "0")}:00`;
    }
    return `<tr>
      <td><b>${label}</b></td>
      <td style="text-align:right">${r.total.toLocaleString()}</td>
      <td style="text-align:right;color:#ff4757">${r.A.toLocaleString()}</td>
      <td style="text-align:right;color:#ff6348">${r.B.toLocaleString()}</td>
      <td style="text-align:right;color:#ffa502">${r.C.toLocaleString()}</td>
      <td style="text-align:right;color:#7a8ba0">${r.D.toLocaleString()}</td>
      <td style="text-align:right">${succ}%</td>
    </tr>`;
  }).join("");

  const html = `
    <div class="section">

        <span class="badge badge-info">${dateLabel}</span>

        </div>
        <div class="kpi" style="border-color:#00ff88">
          <div class="kpi-label" style="color:#00ff88">A 全自动成功</div>
          <div class="kpi-value" style="color:#00ff88">${totalA.toLocaleString()}</div>
          <div class="kpi-foot">${total ? (totalA / total * 100).toFixed(1) : 0}% 占总单数</div>
        </div>
        <div class="kpi" style="border-color:#ff4757">
          <div class="kpi-label" style="color:#ff4757">B 全自动失败</div>
          <div class="kpi-value" style="color:#ff4757">${totalB.toLocaleString()}</div>
          <div class="kpi-foot">${total ? (totalB / total * 100).toFixed(1) : 0}% 占总单数</div>

          <div class="kpi-value" style="color:#ffa502">${totalC.toLocaleString()}</div>
          <div class="kpi-foot">${total ? (totalC / total * 100).toFixed(1) : 0}% 占总单数</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📈 折线趋势图（4 路径每小时比率 · 0-24 点）</div>
      <div id="chart-hourly-line" style="height:420px"></div>
    </div>

    <div class="section">
      <div class="section-title">📊 24 小时分桶明细（0-23 点 · 凌晨到深夜）</div>
      <table class="detail-table">
        <thead><tr><th>时段</th><th style="text-align:right">总单数</th>
          <th style="text-align:right;color:#ff4757">A 全自动成功</th>
          <th style="text-align:right;color:#ff6348">B 全自动失败</th>
          <th style="text-align:right;color:#ffa502">C 订单转人工</th>
          <th style="text-align:right;color:#7a8ba0">D 订单处理中</th>
          <th style="text-align:right">自动化成功率</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  `;
  document.getElementById("mainArea").innerHTML = html;

  // 渲染 ECharts 折线图（25 hour · 4 路径 + max/min 标记）
  setTimeout(() => {
    // 改法 A: 0:00 标签 = "00:00(跨天)" 让用户知道这是跨天起点
    const hours = fullData.map(r => {
      if (r.hour === 0) return "00:00(跨天)";
      if (r.hour === 24) return "24:00";
      return `${String(r.hour).padStart(2, "0")}:00`;
    });
    // 2026-07-20 优化: max/min 排除 0:00 跨天点 (永远是 0, 会被误标为"最低")
    // 手算 1-24 范围的极值, 用 coord 显式指定 markPoint 位置
    const findExtreme = (arr, mode) => {
      let bestI = 1, bestV = arr[1];
      for (let i = 2; i < arr.length; i++) {
        if (mode === 'max' ? arr[i] > bestV : arr[i] < bestV) {
          bestV = arr[i]; bestI = i;
        }
      }
      return { i: bestI, v: +bestV.toFixed(2) };
    };
    const A_arr = fullData.map(r => (r.A + r.B) ? r.A / (r.A + r.B) * 100 : 0);
    const B_arr = fullData.map(r => (r.A + r.B) ? r.B / (r.A + r.B) * 100 : 0);
    const C_arr = fullData.map(r => r.total ? r.C / r.total * 100 : 0);
    const D_arr = fullData.map(r => r.total ? r.D / r.total * 100 : 0);
    const A_max = findExtreme(A_arr, 'max'), A_min = findExtreme(A_arr, 'min');
    const B_max = findExtreme(B_arr, 'max'), B_min = findExtreme(B_arr, 'min');
    const C_max = findExtreme(C_arr, 'max'), C_min = findExtreme(C_arr, 'min');
    const D_max = findExtreme(D_arr, 'max'), D_min = findExtreme(D_arr, 'min');
    const mkPt = (mx, mn) => ({
      symbol: "pin", symbolSize: 50,
      data: [
        { name: "最高", coord: [mx.i, mx.v], value: mx.v, itemStyle: { color: "#00ff88" } },
        { name: "最低", coord: [mn.i, mn.v], value: mn.v, itemStyle: { color: "#ff4757" } }
      ],
      label: { color: "#fff", fontSize: 10 }
    });
    const lineChart = echarts.init(document.getElementById("chart-hourly-line"));
    lineChart.setOption({
      tooltip: {
        trigger: "axis",
        axisPointer: { type: "cross", label: { backgroundColor: "#1e3a5f" } }
      },
      legend: { top: 0, textStyle: { color: "#aab5c5" } },
      grid: { top: 50, left: 60, right: 30, bottom: 60 },
      toolbox: { feature: { saveAsImage: {} } },
      xAxis: {
        type: "category",
        boundaryGap: false,
        data: hours,
        axisLabel: { color: "#aab5c5", rotate: 45, fontSize: 10, interval: 0 },
        axisLine: { lineStyle: { color: "#1e3a5f" } }
      },
      yAxis: {
        type: "value",
        name: "路径比率(%)",
        min: 0, max: 100,
        axisLabel: { color: "#aab5c5", formatter: "{value}%" },
        splitLine: { lineStyle: { color: "#1e3a5f40" } }
      },
      series: [
        { name: "A 路径 · 自动出票成功率", type: "line", smooth: true, symbol: "circle", symbolSize: 8,
          lineStyle: { color: "#ff4757", width: 3 },
          itemStyle: { color: "#ff4757" },
          markPoint: mkPt(A_max, A_min),
          data: A_arr.map(v => +v.toFixed(2)) },
        { name: "B 路径 · 自动出票失败率", type: "line", smooth: true, symbol: "circle", symbolSize: 8,
          lineStyle: { color: "#ff6348", width: 3 },
          itemStyle: { color: "#ff6348" },
          markPoint: mkPt(B_max, B_min),
          data: B_arr.map(v => +v.toFixed(2)) },
        { name: "C 路径 · 人工介入率", type: "line", smooth: true, symbol: "circle", symbolSize: 8,
          lineStyle: { color: "#ffa502", width: 3 },
          itemStyle: { color: "#ffa502" },
          markPoint: mkPt(C_max, C_min),
          data: C_arr.map(v => +v.toFixed(2)) },
        { name: "D 路径 · 异常率", type: "line", smooth: true, symbol: "circle", symbolSize: 6,
          lineStyle: { color: "#7a8ba0", width: 2, type: "dashed" },
          itemStyle: { color: "#7a8ba0" },
          markPoint: mkPt(D_max, D_min),
          data: D_arr.map(v => +v.toFixed(2)) }
      ]
    });
    chartInstances["hourlyLine"] = lineChart;
  }, 50);
}
